<!DOCTYPE html>
<html lang="ja" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA用メタタグ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Task Master Pro V2</title>

    <!-- 約束のアイコン自動追加（エラーを防ぐため静的に配置） -->
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M25 50 l15 15 l35 -35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" type="image/svg+xml">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M25 50 l15 15 l35 -35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>

    <!-- FontAwesome Icons (lucideの代わりに安定のCDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (ブラウザ内でReact JSXをコンパイル) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- QRコード生成ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <style>
        /* カスタムスクロールバー＆全体調整 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* 音声入力時のアニメーション */
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
        .recording-pulse { position: relative; }
        .recording-pulse::before {
            content: ''; position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            background-color: #ef4444; border-radius: 50%; z-index: -1; animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- API Key & Global Settings ---
        const apiKey = ""; // Gemini API Key: 必要な場合はここに入力してね
        
        function App() {
            // --- State Management ---
            const [currentView, setCurrentView] = useState('dashboard'); // dashboard, taskDetail, trash, analytics, settings
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [activeTagFilter, setActiveTagFilter] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [isFocusMode, setIsFocusMode] = useState(false);
            
            // Data States
            const [tasks, setTasks] = useState([]);
            const [routines, setRoutines] = useState([]);
            const [schedules, setSchedules] = useState([]);
            const [activityLog, setActivityLog] = useState({});
            const [userStats, setUserStats] = useState({ level: 1, xp: 0 });
            
            // Sync States (Grand Integration Pro)
            const [todos, setTodos] = useState([]);
            const [memos, setMemos] = useState([]);

            // API & External State
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiMessage, setAiMessage] = useState("");
            const [isRecording, setIsRecording] = useState(false);

            // 安全にローカルストレージを読み込む関数（エラー回避用）
            const safeParse = (key, defaultVal) => {
                try {
                    const item = localStorage.getItem(key);
                    if (!item) return defaultVal;
                    return JSON.parse(item);
                } catch (e) {
                    console.warn(`[TaskMaster] データ修復: ${key} が壊れていたため初期化します`);
                    return defaultVal;
                }
            };

            // --- 1. Initialization & PWA & Permissions ---
            useEffect(() => {
                // PWAマニフェスト動的生成（エラーを防ぐためtry-catchで囲む）
                try {
                    const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M25 50 l15 15 l35 -35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>`;
                    const iconUrl = `data:image/svg+xml;utf8,${encodeURIComponent(iconSvg)}`;
                    const manifest = {
                        name: "Task Master Pro V2", short_name: "TaskMaster",
                        start_url: ".", display: "standalone",
                        background_color: "#f8fafc", theme_color: "#6366f1",
                        icons: [{ src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" }]
                    };
                    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
                    const manifestUrl = URL.createObjectURL(manifestBlob);
                    let linkManifest = document.createElement('link');
                    linkManifest.rel = 'manifest'; linkManifest.href = manifestUrl;
                    document.head.appendChild(linkManifest);
                } catch (e) {
                    console.warn("マニフェストの動的生成がブロックされました。");
                }

                // 通知の許可リクエスト
                if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }

                // データロード
                loadData();

                // Storage Sync Listener
                const handleStorageChange = (e) => {
                    if (e.key === 'grandTodos') setTodos(safeParse('grandTodos', []));
                    if (e.key === 'grandMemos') setMemos(safeParse('grandMemos', []));
                    if (e.key === 'grandTheme') {
                        const theme = e.newValue;
                        setIsDarkMode(theme === 'dark');
                        document.documentElement.classList.toggle('dark', theme === 'dark');
                    }
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            const loadData = () => {
                const lTasks = safeParse('taskMaster_tasks', []);
                const lRoutines = safeParse('taskMaster_routines', []);
                const lSchedules = safeParse('taskMaster_schedules', []);
                const lActivityLog = safeParse('taskMaster_activityLog', {});
                const lStats = safeParse('taskMaster_stats', {level: 1, xp: 0});
                const lTheme = localStorage.getItem('taskMaster_theme') === 'dark';
                
                // 既存データの互換性対応 (streak等追加)
                let migratedTasks = [];
                if (Array.isArray(lTasks)) {
                    migratedTasks = lTasks.map(t => ({ ...t, tags: t.tags || [], streak: t.streak || 0, lastCompletedDate: t.lastCompletedDate || null }));
                }
                
                // ルーチン自動復活
                const todayStr = new Date().toISOString().split('T')[0];
                const lastLogin = localStorage.getItem('taskMaster_lastLogin');
                
                if (lastLogin !== todayStr) {
                    // 日付が変わったら、ルーチンタスクを active に戻す
                    migratedTasks.forEach(t => {
                        if (t.type === 'routine' && t.status === 'completed') {
                            t.status = 'active';
                        }
                    });
                    localStorage.setItem('taskMaster_lastLogin', todayStr);
                    
                    // ブラウザ通知 (期限近いもの)
                    if ("Notification" in window && Notification.permission === "granted") {
                        const dueSoon = migratedTasks.filter(t => t.status === 'active' && t.dueDate && (new Date(t.dueDate) - new Date()) / (1000*60*60*24) <= 3);
                        if (dueSoon.length > 0) {
                            new Notification("Task Master Pro", { body: `締め切りが近いタスクが${dueSoon.length}件あります！頑張ろう！`, icon: "https://cdn-icons-png.flaticon.com/512/1004/1004305.png" });
                        }
                    }
                }

                setTasks(migratedTasks);
                setRoutines(Array.isArray(lRoutines) ? lRoutines : []);
                setSchedules(Array.isArray(lSchedules) ? lSchedules : []);
                setActivityLog(lActivityLog);
                setUserStats(lStats);
                setIsDarkMode(lTheme);
                document.documentElement.classList.toggle('dark', lTheme);

                setTodos(safeParse('grandTodos', []));
                setMemos(safeParse('grandMemos', []));
            };

            // Save changes automatically
            useEffect(() => {
                if(tasks.length === 0 && userStats.xp === 0) return; // 初回ロード前の空セーブ防止
                localStorage.setItem('taskMaster_tasks', JSON.stringify(tasks));
                localStorage.setItem('taskMaster_routines', JSON.stringify(routines));
                localStorage.setItem('taskMaster_schedules', JSON.stringify(schedules));
                localStorage.setItem('taskMaster_activityLog', JSON.stringify(activityLog));
                localStorage.setItem('taskMaster_stats', JSON.stringify(userStats));
                localStorage.setItem('taskMaster_theme', isDarkMode ? 'dark' : 'light');
                
                localStorage.setItem('grandTodos', JSON.stringify(todos));
                localStorage.setItem('grandMemos', JSON.stringify(memos));
            }, [tasks, routines, schedules, activityLog, userStats, isDarkMode, todos, memos]);

            // --- Helper Functions ---
            const logActivityAndGainXP = () => {
                const today = new Date().toISOString().split('T')[0];
                setActivityLog(prev => ({ ...prev, [today]: (prev[today] || 0) + 1 }));
                
                setUserStats(prev => {
                    let newXp = prev.xp + 10;
                    let newLevel = prev.level;
                    const xpNeeded = newLevel * 50; 
                    if (newXp >= xpNeeded) {
                        newLevel++;
                        newXp -= xpNeeded;
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification("レベルアップ！", { body: `おめでとう！レベル${newLevel}になったよ！🎉` });
                        }
                    }
                    return { level: newLevel, xp: newXp };
                });
            };

            const toggleTheme = () => {
                const newTheme = !isDarkMode;
                setIsDarkMode(newTheme);
                document.documentElement.classList.toggle('dark', newTheme);
            };

            // Googleカレンダーエクスポート (.ics)
            const exportToICS = () => {
                let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Task Master Pro V2//EN\n";
                
                const activeTasks = tasks.filter(t => t.status === 'active' && t.dueDate);
                activeTasks.forEach(task => {
                    const dateStr = task.dueDate.replace(/-/g, '');
                    icsContent += `BEGIN:VEVENT\nDTSTART;VALUE=DATE:${dateStr}\nSUMMARY:${task.title}\nDESCRIPTION:${task.memo || ''}\nEND:VEVENT\n`;
                });
                schedules.forEach(sc => {
                    if(!sc.date) return;
                    const dateStr = sc.date.replace(/-/g, '');
                    icsContent += `BEGIN:VEVENT\nDTSTART;VALUE=DATE:${dateStr}\nSUMMARY:${sc.title}\nEND:VEVENT\n`;
                });
                
                icsContent += "END:VCALENDAR";
                
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'taskmaster_schedule.ics'; a.click();
                URL.revokeObjectURL(url);
            };

            // --- Handlers ---
            const addTask = (type, title = '新しいタスク') => {
                const newTask = {
                    id: Date.now().toString(), title: title, type: type, 
                    status: 'active', dueDate: '', subtasks: [], memo: '', tags: [], 
                    streak: 0, lastCompletedDate: null, createdAt: new Date().toISOString()
                };
                setTasks([...tasks, newTask]);
            };

            const toggleTaskStatus = (taskId) => {
                const todayStr = new Date().toISOString().split('T')[0];
                setTasks(tasks.map(t => {
                    if (t.id === taskId) {
                        const newStatus = t.status === 'active' ? 'completed' : 'active';
                        let newStreak = t.streak || 0;
                        let lastCompleted = t.lastCompletedDate;

                        if (newStatus === 'completed') {
                            logActivityAndGainXP();
                            // ストリーク計算 (ルーチンなどで昨日完了していれば継続)
                            if (t.type === 'routine') {
                                const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                                const yesterdayStr = yesterday.toISOString().split('T')[0];
                                if (t.lastCompletedDate === yesterdayStr) {
                                    newStreak += 1;
                                } else if (t.lastCompletedDate !== todayStr) {
                                    newStreak = 1; // 途切れたら1から
                                }
                                lastCompleted = todayStr;
                            }
                        }
                        return { ...t, status: newStatus, streak: newStreak, lastCompletedDate: lastCompleted };
                    }
                    return t;
                }));
            };

            const moveToTrash = (taskId) => {
                setTasks(tasks.map(t => t.id === taskId ? { ...t, status: 'trash' } : t));
                if (selectedTaskId === taskId) setCurrentView('dashboard');
            };

            // 音声入力 (Web Speech API)
            const startVoiceInput = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("お使いのブラウザは音声入力に対応していません😭 Chrome等を使ってね！");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.start();
                setIsRecording(true);

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    addTask('normal', transcript);
                    setIsRecording(false);
                };
                recognition.onerror = () => setIsRecording(false);
                recognition.onend = () => setIsRecording(false);
            };

            // AIモチベーター呼び出し
            const callAiMotivator = async () => {
                if(!apiKey) {
                    setAiMessage("APIキーが設定されていないみたい！でも君なら絶対できるよ！応援してる！🔥");
                    return;
                }
                setIsAiLoading(true);
                try {
                    const prompt = `あなたは熱血でポジティブなAIサポーターです。タスク管理を頑張っているユーザーに向けて、短い（2〜3文）ですが、テンションが爆上がりするような熱い応援や褒め言葉をかけてください。`;
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    setAiMessage(text || "よし、その調子だ！君は素晴らしい！");
                } catch (e) {
                    setAiMessage("フレー！フレー！焦らず自分のペースでいこう！");
                }
                setIsAiLoading(false);
                setTimeout(() => setAiMessage(""), 8000); // 8秒で消える
            };

            // --- UI Components ---
            
            // コンパクト化＆機能追加したタスクリスト
            const TaskList = ({ type, title, icon }) => {
                let list = tasks.filter(t => t.type === type && t.status === 'active');
                if (activeTagFilter) list = list.filter(t => t.tags?.includes(activeTagFilter));
                
                list.sort((a, b) => {
                    if (!a.dueDate) return 1; if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                });

                if (type === 'completed') {
                    list = tasks.filter(t => t.status === 'completed');
                    if (activeTagFilter) list = list.filter(t => t.tags?.includes(activeTagFilter));
                }

                const getBgColor = (task) => {
                    if(task.status === 'completed') return 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700 opacity-70';
                    if(!task.dueDate) return 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                    const diff = Math.ceil((new Date(task.dueDate) - new Date()) / (1000 * 60 * 60 * 24));
                    if (diff <= 1) return 'bg-rose-50 dark:bg-rose-900/20 border-rose-400 dark:border-rose-600 shadow-[0_0_8px_rgba(225,29,72,0.3)]'; 
                    if (diff <= 3) return 'bg-orange-50 dark:bg-orange-900/20 border-orange-300 dark:border-orange-700'; 
                    return 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                };

                return (
                  <div className="mb-6">
                    <h2 className="text-lg font-bold text-slate-700 dark:text-slate-200 border-b-2 border-slate-200 dark:border-slate-700 pb-1 mb-3 flex items-center justify-between">
                        <span className="flex items-center"><i className={`${icon} mr-2`}></i> {title} 
                            {activeTagFilter && <span className="ml-2 text-xs font-normal bg-indigo-100 text-indigo-600 dark:bg-indigo-900 dark:text-indigo-300 px-2 py-0.5 rounded-full">#{activeTagFilter}</span>}
                        </span>
                        {type !== 'completed' && <button onClick={() => addTask(type)} className="text-xs bg-indigo-100 text-indigo-700 dark:bg-indigo-600 dark:text-white px-3 py-1 rounded-full hover:bg-indigo-200 transition-colors flex items-center"><i className="fa-solid fa-plus mr-1"></i>追加</button>}
                    </h2>
                    <div className="space-y-2">
                      {list.map((task, index) => {
                          const progress = task.subtasks.length > 0 ? Math.round((task.subtasks.filter(s => s.status === 'completed').length / task.subtasks.length) * 100) : 0;
                          return (
                            <div key={task.id} className={`group flex items-center justify-between p-2 rounded-lg border ${getBgColor(task)} transition-all hover:shadow-md`}>
                              <div className="flex items-center gap-3 flex-1 overflow-hidden">
                                <button onClick={() => toggleTaskStatus(task.id)} className="flex-shrink-0 text-slate-400 dark:text-slate-500 hover:text-emerald-500 transition-colors">
                                  {task.status === 'completed' ? <i className="fa-solid fa-circle-check text-emerald-500 text-xl"></i> : <i className="fa-regular fa-circle text-xl"></i>}
                                </button>
                                <div className="flex-1 cursor-pointer truncate flex flex-col justify-center" onClick={() => { setSelectedTaskId(task.id); setCurrentView('taskDetail'); }}>
                                    <div className="flex items-center gap-2">
                                        <p className={`font-semibold truncate text-sm md:text-base ${task.status === 'completed' ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}`}>{task.title}</p>
                                        {task.streak > 1 && <span className="text-xs font-bold text-orange-500 flex items-center bg-orange-100 dark:bg-orange-900/30 px-1.5 rounded"><i className="fa-solid fa-fire mr-1"></i>{task.streak}</span>}
                                    </div>
                                    <div className="flex flex-wrap items-center text-[11px] md:text-xs text-slate-500 dark:text-slate-400 gap-x-3 gap-y-1 mt-0.5">
                                        {task.dueDate && <span className={Math.ceil((new Date(task.dueDate) - new Date()) / (1000 * 60 * 60 * 24)) <= 1 ? 'text-rose-500 font-bold' : ''}><i className="fa-regular fa-calendar mr-1"></i>{task.dueDate.replace('2026-','')}</span>}
                                        {task.tags?.length > 0 && <span><i className="fa-solid fa-tag mr-1 text-indigo-400"></i>{task.tags[0]}{task.tags.length>1&&'..'}</span>}
                                        {task.subtasks.length > 0 && <span>進捗: {progress}%</span>}
                                    </div>
                                </div>
                              </div>
                              <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                {type !== 'completed' && !activeTagFilter && (
                                  <div className="flex flex-col">
                                     <button onClick={() => {
                                         const newList = [...tasks];
                                         const idx = tasks.findIndex(t => t.id === task.id);
                                         if(idx > 0) { [newList[idx], newList[idx-1]] = [newList[idx-1], newList[idx]]; setTasks(newList); }
                                     }} className="p-1 text-slate-400 hover:text-indigo-500"><i className="fa-solid fa-chevron-up text-[10px]"></i></button>
                                     <button onClick={() => {
                                         const newList = [...tasks];
                                         const idx = tasks.findIndex(t => t.id === task.id);
                                         if(idx < tasks.length-1) { [newList[idx], newList[idx+1]] = [newList[idx+1], newList[idx]]; setTasks(newList); }
                                     }} className="p-1 text-slate-400 hover:text-indigo-500"><i className="fa-solid fa-chevron-down text-[10px]"></i></button>
                                  </div>
                                )}
                                <button onClick={() => moveToTrash(task.id)} className="p-2 text-slate-300 hover:text-rose-500 transition-colors" title="ごみ箱へ"><i className="fa-solid fa-trash-can"></i></button>
                              </div>
                            </div>
                          )
                      })}
                      {list.length === 0 && <p className="text-slate-400 dark:text-slate-500 text-sm italic pl-2">タスクなし</p>}
                    </div>
                  </div>
                );
            };

            const Sidebar = () => {
                const tags = Array.from(new Set(tasks.flatMap(t => t.tags || [])));
                
                return (
                    <div className="w-full md:w-72 flex-shrink-0 flex flex-col gap-4">
                        {/* ユーザーレベル＆AIモチベーター */}
                        <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl shadow-md p-4 text-white relative overflow-hidden group">
                            <div className="flex justify-between items-center mb-2 relative z-10">
                                <span className="font-bold flex items-center text-lg"><i className="fa-solid fa-medal mr-2 text-yellow-300"></i> Lv {userStats.level}</span>
                                <span className="text-xs opacity-90 bg-black/20 px-2 py-1 rounded-full">{userStats.xp} / {userStats.level * 50} XP</span>
                            </div>
                            <div className="w-full bg-black/30 rounded-full h-2 mb-3 relative z-10">
                                <div className="bg-yellow-400 h-2 rounded-full transition-all" style={{ width: `${Math.min(100, (userStats.xp / (userStats.level * 50)) * 100)}%` }}></div>
                            </div>
                            <button onClick={callAiMotivator} disabled={isAiLoading} className="w-full py-1.5 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-bold transition-colors relative z-10 flex justify-center items-center">
                                {isAiLoading ? <i className="fa-solid fa-rotate-right animate-spin"></i> : <><i className="fa-solid fa-bolt text-yellow-300 mr-1"></i> 褒めて！(AI)</>}
                            </button>
                            <i className="fa-solid fa-star absolute -bottom-4 -right-4 text-6xl opacity-10 group-hover:scale-110 transition-transform"></i>
                        </div>

                        {/* ナビゲーション */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-2 flex flex-wrap gap-2">
                            <button onClick={() => setCurrentView('dashboard')} className={`flex-1 min-w-[70px] py-2 rounded-lg text-sm font-bold transition-colors ${currentView === 'dashboard' ? 'bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-regular fa-square-check mr-1"></i>タスク</button>
                            <button onClick={() => setCurrentView('analytics')} className={`flex-1 min-w-[70px] py-2 rounded-lg text-sm font-bold transition-colors ${currentView === 'analytics' ? 'bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-300' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-chart-simple mr-1"></i>分析</button>
                            <button onClick={() => setCurrentView('trash')} className={`flex-1 min-w-[70px] py-2 rounded-lg text-sm font-bold transition-colors ${currentView === 'trash' ? 'bg-rose-100 text-rose-600 dark:bg-rose-900/50 dark:text-rose-300' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-trash-can mr-1"></i>ごみ箱</button>
                        </div>

                        {/* タグフィルター */}
                        {tags.length > 0 && currentView === 'dashboard' && (
                            <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3">
                                <h3 className="font-bold flex items-center text-slate-600 dark:text-slate-300 mb-2 text-xs"><i className="fa-solid fa-tag mr-2 text-indigo-400"></i>タグ絞り込み</h3>
                                <div className="flex flex-wrap gap-1.5">
                                    <button onClick={() => setActiveTagFilter(null)} className={`text-[10px] px-2 py-0.5 rounded-full border transition-colors ${activeTagFilter === null ? 'bg-indigo-500 text-white border-indigo-500' : 'bg-slate-50 dark:bg-slate-700 text-slate-500 dark:text-slate-300 border-slate-200 dark:border-slate-600'}`}>すべて</button>
                                    {tags.map(tag => (
                                        <button key={tag} onClick={() => setActiveTagFilter(tag)} className={`text-[10px] px-2 py-0.5 rounded-full border transition-colors ${activeTagFilter === tag ? 'bg-indigo-500 text-white border-indigo-500' : 'bg-slate-50 dark:bg-slate-700 text-slate-500 dark:text-slate-300 border-slate-200 dark:border-slate-600'}`}>#{tag}</button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 同期データ (Grand Integration Pro用) */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3 flex-1 flex flex-col">
                            <h3 className="font-bold flex items-center text-slate-600 dark:text-slate-300 mb-2 text-sm"><i className="fa-regular fa-file-lines mr-2 text-amber-500"></i>同期メモ (Grand)</h3>
                            <textarea 
                                className="w-full flex-1 min-h-[100px] p-2 text-sm border border-slate-200 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-amber-500 resize-none dark:text-slate-200"
                                value={memos[0]?.content || ''}
                                onChange={(e) => {
                                    const newMemos = memos.length > 0 ? [...memos] : [{id: Date.now(), title: 'メイン'}];
                                    newMemos[0].content = e.target.value; setMemos(newMemos);
                                }}
                                placeholder="同期用のメモ..."
                            />
                        </div>

                        {/* 各種設定＆エクスポート */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3 flex flex-col gap-2">
                             <button onClick={toggleTheme} className="text-xs w-full py-1.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600">
                                 <i className={`fa-solid ${isDarkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-500'} mr-2`}></i>{isDarkMode ? 'ライトモード' : 'ダークモード'}
                             </button>
                             <button onClick={exportToICS} className="text-xs w-full py-1.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600">
                                 <i className="fa-regular fa-calendar mr-2 text-blue-500"></i>カレンダー(.ics)出力
                             </button>
                             <button onClick={() => setCurrentView('settings')} className="text-xs w-full py-1.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600">
                                 <i className="fa-solid fa-qrcode mr-2 text-emerald-500"></i>スマホへデータ移行(QR)
                             </button>
                        </div>
                    </div>
                );
            };

            const Dashboard = () => (
                <div className="flex-1 min-w-0">
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">ダッシュボード</h1>
                        <div className="flex gap-2">
                            <button onClick={startVoiceInput} className={`p-2 rounded-full ${isRecording ? 'bg-rose-500 text-white recording-pulse' : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-sm border border-slate-200 dark:border-slate-700'}`} title="音声入力">
                                <i className="fa-solid fa-microphone"></i>
                            </button>
                            <button onClick={() => {
                                const data = { tasks, routines, schedules, userStats };
                                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                                const a = document.createElement('a');
                                a.href = URL.createObjectURL(blob); a.download = 'taskmaster_backup.json'; a.click();
                            }} className="px-3 py-2 bg-slate-800 dark:bg-slate-700 text-white rounded-lg hover:bg-slate-700 text-xs md:text-sm font-medium shadow-sm flex items-center"><i className="fa-solid fa-floppy-disk mr-1.5"></i>保存</button>
                        </div>
                    </div>

                    {/* AIメッセージ表示エリア */}
                    {aiMessage && (
                        <div className="mb-6 bg-gradient-to-r from-yellow-100 to-orange-100 dark:from-yellow-900/40 dark:to-orange-900/40 border-l-4 border-yellow-400 p-4 rounded-r shadow-sm animate-bounce">
                            <p className="text-orange-800 dark:text-orange-200 font-bold flex items-start">
                                <i className="fa-solid fa-robot mr-2 mt-1 text-xl"></i>
                                <span>{aiMessage}</span>
                            </p>
                        </div>
                    )}
                    
                    {/* ヒートマップ */}
                    <div className="mb-6 bg-white dark:bg-slate-800 p-3 md:p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <h3 className="text-xs md:text-sm font-bold text-slate-600 dark:text-slate-300 mb-2 flex items-center"><i className="fa-solid fa-bolt text-yellow-500 mr-1"></i> アクティビティ</h3>
                        <div className="flex flex-wrap gap-1">
                            {[...Array(28)].map((_, i) => {
                                const d = new Date(); d.setDate(d.getDate() - (27 - i));
                                const dateStr = d.toISOString().split('T')[0];
                                const count = activityLog[dateStr] || 0;
                                let color = 'bg-slate-100 dark:bg-slate-700';
                                if (count > 0) color = 'bg-emerald-200 dark:bg-emerald-800/60';
                                if (count > 2) color = 'bg-emerald-400 dark:bg-emerald-600';
                                if (count > 5) color = 'bg-emerald-600 dark:bg-emerald-400';
                                return <div key={i} title={`${dateStr}: ${count}件`} className={`w-3 h-3 md:w-4 md:h-4 rounded-sm ${color}`}></div>
                            })}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                        <div className="xl:col-span-2 space-y-2">
                            <TaskList type="normal" title="メインタスク" icon="fa-solid fa-circle-check text-indigo-500" />
                            <TaskList type="someday" title="いつかやる" icon="fa-regular fa-clock text-amber-500" />
                            <TaskList type="routine" title="日課・ルーチン" icon="fa-solid fa-rotate-right text-emerald-500" />
                            <div className="mt-8 opacity-70">
                                <TaskList type="completed" title="完了済み" icon="fa-solid fa-check text-slate-400" />
                            </div>
                        </div>
                        <div>
                            {/* スケジュール（簡易版） */}
                            <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 sticky top-4">
                                <h2 className="text-base font-bold text-slate-700 dark:text-slate-200 mb-3 flex items-center"><i className="fa-regular fa-calendar text-blue-500 mr-2"></i>スケジュール</h2>
                                <div className="space-y-2 max-h-[300px] overflow-y-auto">
                                    {schedules.map(sc => (
                                        <div key={sc.id} className="flex flex-col gap-1 text-sm border-b dark:border-slate-700 pb-2">
                                            <div className="flex gap-2">
                                                <input type="date" className="border dark:border-slate-600 rounded p-1 text-slate-600 dark:text-slate-300 bg-transparent text-xs w-32" value={sc.date} onChange={e => setSchedules(schedules.map(s => s.id === sc.id ? {...s, date: e.target.value} : s))}/>
                                                <button onClick={() => setSchedules(schedules.filter(s => s.id !== sc.id))} className="text-rose-400 ml-auto"><i className="fa-solid fa-xmark"></i></button>
                                            </div>
                                            <input type="text" className="w-full border-none bg-slate-50 dark:bg-slate-900 rounded p-1.5 focus:ring-1" value={sc.title} onChange={e => setSchedules(schedules.map(s => s.id === sc.id ? {...s, title: e.target.value} : s))} placeholder="予定内容"/>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setSchedules([...schedules, {id: Date.now().toString(), title: '', date: ''}])} className="mt-3 text-xs bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 px-3 py-1.5 rounded-lg w-full font-bold"><i className="fa-solid fa-plus mr-1"></i>追加</button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const TaskDetail = () => {
                const task = tasks.find(t => t.id === selectedTaskId);
                const [localTitle, setLocalTitle] = useState('');
                const [tagInput, setTagInput] = useState('');

                useEffect(() => { if(task) setLocalTitle(task.title); }, [selectedTaskId]);
                if (!task) return null;

                const updateTask = (updates) => setTasks(tasks.map(t => t.id === task.id ? { ...t, ...updates } : t));
                const addSubtask = () => updateTask({ subtasks: [...task.subtasks, { id: Date.now().toString(), title: '', status: 'active', memo: '' }] });
                const progress = task.subtasks.length > 0 ? Math.round((task.subtasks.filter(s => s.status === 'completed').length / task.subtasks.length) * 100) : 0;

                // フォーカスモード（Pomodoro）
                if (isFocusMode) {
                    return (
                        <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
                            <button onClick={() => setIsFocusMode(false)} className="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800 p-3 rounded-full"><i className="fa-solid fa-xmark text-xl"></i></button>
                            <h2 className="text-white text-xl mb-2 opacity-50"><i className="fa-solid fa-headphones mr-2"></i>集中モード</h2>
                            <p className="text-3xl font-bold text-white mb-10">{task.title}</p>
                            
                            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
                                <h3 className="text-slate-400 text-sm font-bold border-b border-slate-800 pb-2 mb-4">残りの細分項目</h3>
                                <div className="space-y-3 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                                    {task.subtasks.filter(s => s.status !== 'completed').map(sub => (
                                        <div key={sub.id} className="flex items-start gap-3 p-3 bg-slate-800 rounded-xl">
                                            <button onClick={() => {
                                                const newSubs = task.subtasks.map(s => s.id === sub.id ? {...s, status: 'completed'} : s);
                                                updateTask({ subtasks: newSubs });
                                                logActivityAndGainXP();
                                            }} className="mt-0.5 text-slate-500 hover:text-emerald-400 transition-colors"><i className="fa-regular fa-circle text-2xl"></i></button>
                                            <span className="text-slate-200 flex-1 leading-tight">{sub.title}</span>
                                        </div>
                                    ))}
                                    {task.subtasks.filter(s => s.status !== 'completed').length === 0 && <p className="text-emerald-400 font-bold text-center py-4"><i className="fa-solid fa-check-circle mr-2"></i>すべて完了！素晴らしい！</p>}
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="flex-1 min-w-0 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 md:p-8">
                        <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-100 dark:border-slate-700">
                            <button onClick={() => setCurrentView('dashboard')} className="text-slate-500 dark:text-slate-400 hover:text-indigo-600 font-medium"><i className="fa-solid fa-arrow-left mr-2"></i>戻る</button>
                            <div className="flex gap-2">
                                <button onClick={() => moveToTrash(task.id)} className="p-2 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded"><i className="fa-solid fa-trash-can"></i></button>
                                <button onClick={() => setIsFocusMode(true)} className="px-4 py-2 bg-indigo-50 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 rounded hover:bg-indigo-100 font-bold text-sm flex items-center"><i className="fa-solid fa-expand mr-2"></i>集中する</button>
                            </div>
                        </div>

                        <input type="text" className="w-full text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-slate-100 bg-transparent border-none focus:ring-0 mb-3 p-0" 
                            value={localTitle} onChange={(e) => setLocalTitle(e.target.value)} onBlur={() => updateTask({ title: localTitle })} 
                            onKeyDown={(e) => e.key === 'Enter' && e.target.blur()} placeholder="タスク名を入力..." />

                        {/* タグ＆期限 */}
                        <div className="flex flex-wrap items-center gap-2 mb-6">
                            <div className="flex items-center gap-2 flex-wrap flex-1">
                                <i className="fa-solid fa-tag text-slate-400"></i>
                                {task.tags?.map(tag => (
                                    <span key={tag} className="bg-indigo-50 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300 px-2 py-1 rounded text-xs flex items-center">
                                        #{tag} <button onClick={() => updateTask({ tags: task.tags.filter(t => t !== tag) })} className="ml-1 opacity-50 hover:opacity-100"><i className="fa-solid fa-xmark"></i></button>
                                    </span>
                                ))}
                                <input type="text" value={tagInput} onChange={e => setTagInput(e.target.value)}
                                    onKeyDown={(e) => { if(e.key === 'Enter' && tagInput.trim()) { updateTask({ tags: [...new Set([...(task.tags||[]), tagInput.trim().replace(/^#/,'')])]}); setTagInput(''); } }}
                                    placeholder="タグ追加(Enter)" className="text-xs bg-slate-50 dark:bg-slate-900 border-none rounded px-2 py-1 w-32 dark:text-slate-200" />
                            </div>
                            <div className="flex items-center text-sm border-l pl-4 dark:border-slate-700">
                                <i className="fa-regular fa-calendar mr-2 text-slate-400"></i>
                                <input type="date" className="bg-transparent border-none text-slate-600 dark:text-slate-300 p-0 text-sm focus:ring-0 cursor-pointer" value={task.dueDate || ''} onChange={(e) => updateTask({ dueDate: e.target.value })}/>
                            </div>
                        </div>

                        {/* 進捗＆AIボタン */}
                        <div className="flex items-center gap-4 mb-8">
                            <div className="flex-1">
                                <div className="flex justify-between text-xs mb-1 font-bold text-slate-600 dark:text-slate-400"><span>進捗状況</span><span>{progress}%</span></div>
                                <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
                                    <div className="bg-emerald-500 h-2 rounded-full transition-all" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>
                            <button onClick={() => setIsAiLoading(true)} className="px-4 py-2 border-2 border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-900/30 text-xs font-bold flex items-center transition-colors">
                                <i className="fa-solid fa-bolt mr-1"></i> AI細分化
                            </button>
                        </div>

                        {/* サブタスク */}
                        <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-3 flex items-center"><i className="fa-regular fa-square-check text-emerald-500 mr-2"></i>細分項目</h3>
                        <div className="space-y-2 mb-8">
                            {task.subtasks.map((sub, idx) => (
                                <div key={sub.id} className="flex items-start gap-2 p-2 bg-slate-50 dark:bg-slate-900 rounded-lg group">
                                    <button onClick={() => {
                                        const newSubs = task.subtasks.map(s => s.id === sub.id ? {...s, status: s.status==='active'?'completed':'active'} : s);
                                        updateTask({ subtasks: newSubs });
                                    }} className="mt-1 text-slate-400 hover:text-emerald-500">
                                        {sub.status === 'completed' ? <i className="fa-solid fa-circle-check text-emerald-500"></i> : <i className="fa-regular fa-circle"></i>}
                                    </button>
                                    <div className="flex-1">
                                        <input type="text" className={`w-full bg-transparent border-none p-0 focus:ring-0 ${sub.status === 'completed' ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'}`} value={sub.title} onChange={e => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, title: e.target.value} : s) })} placeholder="項目名..." />
                                        <input type="text" className="w-full bg-transparent border-none p-0 focus:ring-0 text-xs text-slate-500 mt-1" value={sub.memo||''} onChange={e => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, memo: e.target.value} : s) })} placeholder="メモ..." />
                                    </div>
                                    <button onClick={() => updateTask({ subtasks: task.subtasks.filter(s => s.id !== sub.id) })} className="opacity-0 group-hover:opacity-100 text-rose-400 p-1"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                            ))}
                            <button onClick={addSubtask} className="w-full py-2 border border-dashed border-slate-300 dark:border-slate-600 rounded text-slate-500 dark:text-slate-400 text-sm hover:bg-slate-50 dark:hover:bg-slate-800"><i className="fa-solid fa-plus mr-1"></i>追加</button>
                        </div>

                        {/* メインメモ */}
                        <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-2"><i className="fa-regular fa-file-lines text-amber-500 mr-2"></i>タスク詳細メモ</h3>
                        <textarea className="w-full h-32 p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 dark:text-slate-200 resize-y" value={task.memo||''} onChange={e => updateTask({ memo: e.target.value })} placeholder="詳細や参考リンクなどを記録..."></textarea>
                    </div>
                );
            };

            const TrashView = () => (
                <div className="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8">
                    <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-6"><i className="fa-solid fa-trash-can text-rose-500 mr-3"></i>ごみ箱</h1>
                    {tasks.filter(t => t.status === 'trash').length === 0 ? <p className="text-center text-slate-400 my-10">ごみ箱は空です</p> : (
                        <div className="space-y-2">
                            {tasks.filter(t => t.status === 'trash').map(task => (
                                <div key={task.id} className="flex justify-between items-center p-3 border dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-900">
                                    <span className="text-slate-500 line-through truncate">{task.title}</span>
                                    <div className="flex gap-2 ml-4 flex-shrink-0">
                                        <button onClick={() => setTasks(tasks.map(t => t.id === task.id ? {...t, status: 'active'} : t))} className="px-3 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 rounded text-xs"><i className="fa-solid fa-rotate-left mr-1"></i>復元</button>
                                        <button onClick={() => setTasks(tasks.filter(t => t.id !== task.id))} className="px-3 py-1 bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400 rounded text-xs">削除</button>
                                    </div>
                                </div>
                            ))}
                            <button onClick={() => setTasks(tasks.filter(t => t.status !== 'trash'))} className="mt-6 px-4 py-2 bg-rose-500 text-white rounded font-bold text-sm w-full md:w-auto md:float-right">ごみ箱を空にする</button>
                        </div>
                    )}
                </div>
            );

            // QRコードエクスポート
            const SettingsView = () => {
                const qrRef = useRef(null);
                
                useEffect(() => {
                    if(currentView === 'settings' && qrRef.current) {
                        qrRef.current.innerHTML = '';
                        // データ量が多いとQRに入らないため、レベルやコアなタスクのみを圧縮文字列化する
                        const exportData = { lv: userStats.level, xp: userStats.xp, t: tasks.filter(t=>t.status==='active').slice(0,10).map(t=>({id:t.id, title:t.title, type:t.type})) };
                        const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(exportData))));
                        const finalStr = `taskmaster://sync?d=${dataStr.substring(0, 500)}`; // 制限のためカット（実運用ではサーバーやファイル経由を推奨）
                        
                        // QRCodeライブラリが読み込めているか安全にチェックして実行
                        if (typeof QRCode !== 'undefined') {
                            new QRCode(qrRef.current, {
                                text: finalStr, width: 200, height: 200, colorDark : "#1e293b", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.L
                            });
                        } else {
                            qrRef.current.innerHTML = '<p class="text-rose-500 text-xs">QRコード生成ライブラリの読み込みに失敗しました。</p>';
                        }
                    }
                }, [currentView]);

                return (
                    <div className="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8">
                        <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-6"><i className="fa-solid fa-mobile-screen text-indigo-500 mr-3"></i>データ引き継ぎ (簡易版)</h1>
                        <p className="text-sm text-slate-600 dark:text-slate-400 mb-6">※QRコードの容量制限のため、レベル・経験値と最近のタスク(10件)のみを転送します。完全なバックアップはダッシュボードの「保存」ボタンからJSONファイルをダウンロードしてください。</p>
                        
                        <div className="flex flex-col items-center p-6 bg-slate-50 dark:bg-slate-900 rounded-xl border border-dashed border-slate-300 dark:border-slate-600">
                            <div ref={qrRef} className="p-4 bg-white rounded-lg shadow-md mb-4"></div>
                            <p className="text-xs text-slate-500 text-center font-bold">スマホのカメラやQRリーダーで読み取ってね</p>
                        </div>
                    </div>
                );
            };

            const AnalyticsView = () => (
                <div className="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8">
                    <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-6"><i className="fa-solid fa-chart-pie text-blue-500 mr-3"></i>分析レポート</h1>
                    <div className="grid grid-cols-2 gap-4 mb-8">
                        <div className="bg-indigo-50 dark:bg-indigo-900/20 p-4 rounded-xl border border-indigo-100 dark:border-indigo-800/50 text-center">
                            <p className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-1">完了タスク総数</p>
                            <p className="text-3xl font-extrabold text-indigo-600 dark:text-indigo-400">{tasks.filter(t=>t.status==='completed').length}</p>
                        </div>
                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-100 dark:border-emerald-800/50 text-center">
                            <p className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-1">現在のレベル</p>
                            <p className="text-3xl font-extrabold text-emerald-600 dark:text-emerald-400">{userStats.level}</p>
                        </div>
                    </div>
                    <p className="text-center text-slate-400 italic">※詳細なグラフやチャート機能は今後のアップデートで追加予定です！</p>
                </div>
            );

            // --- Main Layout ---
            return (
                <div className="min-h-screen flex flex-col md:flex-row gap-4 p-2 md:p-4 lg:p-6 max-w-7xl mx-auto">
                    <Sidebar />
                    <div className="flex-1 min-w-0">
                        {currentView === 'dashboard' && <Dashboard />}
                        {currentView === 'taskDetail' && <TaskDetail />}
                        {currentView === 'trash' && <TrashView />}
                        {currentView === 'settings' && <SettingsView />}
                        {currentView === 'analytics' && <AnalyticsView />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
