<!DOCTYPE html>
<html lang="ja" class="light theme-indigo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Task Master Pro V4</title>

    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M25 50 l15 15 l35 -35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" type="image/svg+xml">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M25 50 l15 15 l35 -35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: 'var(--primary-color)', 'primary-dark': 'var(--primary-dark)' } } }
        }
    </script>
    <style>
        /* カスタムテーマのカラーパレット */
        :root { --primary-color: #6366f1; --primary-dark: #4f46e5; } /* indigo */
        .theme-emerald { --primary-color: #10b981; --primary-dark: #059669; }
        .theme-rose { --primary-color: #f43f5e; --primary-dark: #e11d48; }
        .theme-amber { --primary-color: #f59e0b; --primary-dark: #d97706; }
        .theme-slate { --primary-color: #64748b; --primary-dark: #475569; }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .dragging { opacity: 0.5; transform: scale(0.98); border: 2px dashed var(--primary-color); }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const apiKey = ""; 

        // --- BGM Generator ---
        let audioCtx, bgmNode;
        const playBGM = (type) => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (bgmNode) { bgmNode.stop(); bgmNode.disconnect(); }
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            bgmNode = audioCtx.createBufferSource(); bgmNode.buffer = buffer; bgmNode.loop = true;
            const filter = audioCtx.createBiquadFilter(); const gain = audioCtx.createGain();
            if (type === 'rain') { filter.type = 'lowpass'; filter.frequency.value = 800; gain.gain.value = 0.5; } 
            else if (type === 'cafe') { filter.type = 'lowpass'; filter.frequency.value = 400; gain.gain.value = 0.3; } 
            else return;
            bgmNode.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); bgmNode.start();
        };
        const stopBGM = () => { if (bgmNode) { bgmNode.stop(); bgmNode.disconnect(); bgmNode = null; } };

        // ★入力チラつき防止コンポーネント
        const LocalInput = ({ value, onChange, onEnter, placeholder, className, isTextarea, type = "text" }) => {
            const [localVal, setLocalVal] = useState(value || '');
            useEffect(() => { setLocalVal(value || ''); }, [value]);
            const handleBlur = () => { if (localVal !== value) onChange(localVal); };
            const handleKeyDown = (e) => { if (e.key === 'Enter' && onEnter && !isTextarea) { e.preventDefault(); e.target.blur(); onEnter(); } };
            if (isTextarea) return <textarea value={localVal} onChange={e => setLocalVal(e.target.value)} onBlur={handleBlur} placeholder={placeholder} className={className} />;
            return <input type={type} value={localVal} onChange={e => setLocalVal(e.target.value)} onBlur={handleBlur} onKeyDown={handleKeyDown} placeholder={placeholder} className={className} />;
        };

        function App() {
            // --- Global States ---
            const [currentView, setCurrentView] = useState('dashboard'); // dashboard, taskDetail, trash, settings, analytics, github
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [activeTagFilter, setActiveTagFilter] = useState(null);
            
            // Preferences
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [themeColor, setThemeColor] = useState('theme-indigo');
            const [pinCode, setPinCode] = useState('');
            const [isUnlocked, setIsUnlocked] = useState(false);
            
            // Data
            const [tasks, setTasks] = useState([]);
            const [schedules, setSchedules] = useState([]);
            const [activityLog, setActivityLog] = useState({});
            const [userStats, setUserStats] = useState({ level: 1, xp: 0 });
            
            // Sync Data
            const [todos, setTodos] = useState([]);
            const [memos, setMemos] = useState([]);
            const [currentMemoId, setCurrentMemoId] = useState(null);
            
            // GitHub Feature
            const [githubSettings, setGithubSettings] = useState({ token: '', owner: '', repo: '' });
            const [githubFiles, setGithubFiles] = useState([]);
            const [githubPath, setGithubPath] = useState('');
            const [isGithubLoading, setIsGithubLoading] = useState(false);

            // AI & Utilities
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiMessage, setAiMessage] = useState("");
            const [isFocusMode, setIsFocusMode] = useState(false);

            // --- Initialization & Data Management ---
            const safeParse = (key, defaultVal) => { try { const i = localStorage.getItem(key); return i ? JSON.parse(i) : defaultVal; } catch { return defaultVal; } };

            useEffect(() => {
                let lTasks = safeParse('taskMaster_tasks', []);
                const todayStr = new Date().toISOString().split('T')[0];
                
                // ルーチンの自動復活処理
                if (localStorage.getItem('taskMaster_lastLogin') !== todayStr) {
                    lTasks = lTasks.map(t => {
                        if (t.type === 'routine' && t.status === 'completed') return { ...t, status: 'active', lastCompletedDate: null };
                        return t;
                    });
                    localStorage.setItem('taskMaster_lastLogin', todayStr);
                }

                setTasks(lTasks);
                setSchedules(safeParse('taskMaster_schedules', []));
                setActivityLog(safeParse('taskMaster_activityLog', {}));
                setUserStats(safeParse('taskMaster_stats', {level: 1, xp: 0}));
                setGithubSettings(safeParse('taskMaster_github', {token: '', owner: '', repo: ''}));
                setPinCode(localStorage.getItem('taskMaster_pin') || '');
                
                const tColor = localStorage.getItem('taskMaster_themeColor') || 'theme-indigo';
                setThemeColor(tColor); document.documentElement.className = `light ${tColor}`;
                const lTheme = localStorage.getItem('taskMaster_theme') === 'dark';
                setIsDarkMode(lTheme); document.documentElement.classList.toggle('dark', lTheme);

                const lTodos = safeParse('grandTodos', []);
                const lMemos = safeParse('grandMemos', []);
                setTodos(lTodos); setMemos(lMemos);
                if (lMemos.length > 0) setCurrentMemoId(lMemos[0].id);

                const handleStorageChange = (e) => {
                    if (e.key === 'grandTodos') setTodos(safeParse('grandTodos', []));
                    if (e.key === 'grandMemos') setMemos(safeParse('grandMemos', []));
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            useEffect(() => {
                if(tasks.length === 0 && userStats.xp === 0) return;
                localStorage.setItem('taskMaster_tasks', JSON.stringify(tasks));
                localStorage.setItem('taskMaster_schedules', JSON.stringify(schedules));
                localStorage.setItem('taskMaster_activityLog', JSON.stringify(activityLog));
                localStorage.setItem('taskMaster_stats', JSON.stringify(userStats));
                localStorage.setItem('taskMaster_github', JSON.stringify(githubSettings));
                localStorage.setItem('taskMaster_theme', isDarkMode ? 'dark' : 'light');
                localStorage.setItem('taskMaster_themeColor', themeColor);
                localStorage.setItem('grandTodos', JSON.stringify(todos));
                localStorage.setItem('grandMemos', JSON.stringify(memos));
            }, [tasks, schedules, activityLog, userStats, isDarkMode, themeColor, todos, memos, githubSettings]);

            // --- Core Functions ---
            const logActivityAndGainXP = () => {
                const today = new Date().toISOString().split('T')[0];
                setActivityLog(prev => ({ ...prev, [today]: (prev[today] || 0) + 1 }));
                setUserStats(prev => {
                    let newXp = prev.xp + 10, newLevel = prev.level;
                    if (newXp >= newLevel * 50) { newLevel++; newXp -= (newLevel - 1) * 50; }
                    return { level: newLevel, xp: newXp };
                });
            };

            const toggleTaskStatus = (taskId) => {
                const todayStr = new Date().toISOString().split('T')[0];
                setTasks(tasks.map(t => {
                    if (t.id === taskId) {
                        const newStatus = t.status === 'active' ? 'completed' : 'active';
                        let newStreak = t.streak || 0;
                        if (newStatus === 'completed') {
                            logActivityAndGainXP();
                            if (t.type === 'routine') {
                                const y = new Date(); y.setDate(y.getDate() - 1);
                                if (t.lastCompletedDate === y.toISOString().split('T')[0]) newStreak++;
                                else newStreak = 1;
                            }
                        }
                        return { ...t, status: newStatus, streak: newStreak, lastCompletedDate: newStatus === 'completed' ? todayStr : t.lastCompletedDate };
                    }
                    return t;
                }));
            };

            // AI Features
            const callAiMotivator = async () => {
                if(!apiKey) { setAiMessage("君ならできる！応援してるよ！🔥"); setTimeout(()=>setAiMessage(""), 5000); return; }
                setIsAiLoading(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "熱血なAIとしてタスク管理を頑張るユーザーを2文で熱く褒めて。" }] }] })
                    });
                    const data = await res.json(); setAiMessage(data.candidates?.[0]?.content?.parts?.[0]?.text || "素晴らしい！");
                } catch (e) { setAiMessage("焦らず自分のペースで！"); }
                setIsAiLoading(false); setTimeout(() => setAiMessage(""), 6000);
            };

            const generateAiMilestones = async (task) => {
                if(!apiKey) { alert("APIキーが未設定です。"); return; }
                setIsAiLoading(true);
                try {
                    const prompt = `タスク「${task.title}」を達成するためのマイルストーン(細分化ステップ)を3〜5個作成し、以下のJSON配列のみ出力してください。\n[{"title":"ステップ名","memo":"詳細"}]`;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    const jsonMatch = text.match(/\[.*\]/s);
                    if(jsonMatch) {
                        const steps = JSON.parse(jsonMatch[0]);
                        const newSubs = steps.map(s => ({ id: Date.now().toString()+Math.random(), title: s.title, status: 'active', memo: s.memo || '' }));
                        setTasks(tasks.map(t => t.id === task.id ? { ...t, subtasks: [...(t.subtasks||[]), ...newSubs] } : t));
                    }
                } catch(e) { alert("AIの生成に失敗しました。"); }
                setIsAiLoading(false);
            };

            // GitHub Folder Features
            const fetchGithubPath = async (path = '') => {
                if (!githubSettings.token) { alert("設定画面からGitHub連携を行ってください。"); return; }
                setIsGithubLoading(true);
                try {
                    const res = await fetch(`https://api.github.com/repos/${githubSettings.owner}/${githubSettings.repo}/contents/${path}`, { headers: { 'Authorization': `token ${githubSettings.token}` } });
                    if (res.ok) {
                        const data = await res.json();
                        setGithubFiles(Array.isArray(data) ? data : [data]); setGithubPath(path);
                    } else { alert("GitHubの読み込みに失敗しました。"); }
                } catch(e) {}
                setIsGithubLoading(false);
            };

            const uploadToGithub = async (fileObj, customPath) => {
                if (!githubSettings.token) return;
                setIsGithubLoading(true);
                try {
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        const base64 = evt.target.result.split(',')[1];
                        const targetPath = customPath || (githubPath ? `${githubPath}/${fileObj.name}` : fileObj.name);
                        
                        let sha = null;
                        const check = await fetch(`https://api.github.com/repos/${githubSettings.owner}/${githubSettings.repo}/contents/${targetPath}`, { headers: { 'Authorization': `token ${githubSettings.token}` } });
                        if(check.ok) sha = (await check.json()).sha;

                        const res = await fetch(`https://api.github.com/repos/${githubSettings.owner}/${githubSettings.repo}/contents/${targetPath}`, {
                            method: 'PUT', headers: { 'Authorization': `token ${githubSettings.token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Upload ${fileObj.name}`, content: base64, ...(sha && { sha }) })
                        });
                        if(res.ok) { alert("アップロード完了！"); fetchGithubPath(githubPath); }
                    };
                    reader.readAsDataURL(fileObj);
                } catch(e) {}
                setIsGithubLoading(false);
            };

            const createGithubFolder = async () => {
                const folderName = prompt("新しいフォルダ名を入力:");
                if(!folderName) return;
                setIsGithubLoading(true);
                const targetPath = githubPath ? `${githubPath}/${folderName}/.gitkeep` : `${folderName}/.gitkeep`;
                const res = await fetch(`https://api.github.com/repos/${githubSettings.owner}/${githubSettings.repo}/contents/${targetPath}`, {
                    method: 'PUT', headers: { 'Authorization': `token ${githubSettings.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Create folder ${folderName}`, content: btoa('') })
                });
                if(res.ok) fetchGithubPath(githubPath);
                setIsGithubLoading(false);
            };

            // --- JSON Import from hub_backup.json ---
            const importJSONData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const j = JSON.parse(evt.target.result);
                        if (j.memos) { setMemos(j.memos); if(j.memos.length>0) setCurrentMemoId(j.memos[0].id); }
                        else if (j.memo !== undefined) { const nm = [{id:Date.now(), title:'インポートメモ', content:j.memo}]; setMemos(nm); setCurrentMemoId(nm[0].id); }
                        if (j.todos) setTodos(j.todos);
                        if (j.tasks) setTasks(j.tasks);
                        if (j.schedules) setSchedules(j.schedules);
                        alert("データを正常にインポートしました！");
                    } catch(err) { alert("JSONファイルの形式が正しくありません。"); }
                };
                reader.readAsText(file);
            };


            // --- UI Components ---
            const Sidebar = () => {
                const activeMemo = memos.find(m => m.id === currentMemoId) || memos[0] || { content: '' };
                const handleMemoUpdate = (id, field, value) => setMemos(memos.map(m => m.id === id ? {...m, [field]: value} : m));

                return (
                    <div className="w-full md:w-72 flex-shrink-0 flex flex-col gap-4">
                        {/* ユーザーレベル＆AIモチベーター */}
                        <div className="bg-primary rounded-xl shadow-md p-4 text-white relative overflow-hidden group">
                            <span className="font-bold flex items-center text-lg mb-2 relative z-10"><i className="fa-solid fa-medal text-yellow-300 mr-2"></i> Lv {userStats.level}</span>
                            <div className="w-full bg-black/20 rounded-full h-2 mb-3 relative z-10"><div className="bg-yellow-400 h-2 rounded-full" style={{ width: `${Math.min(100, (userStats.xp / (userStats.level * 50)) * 100)}%` }}></div></div>
                            <button onClick={callAiMotivator} disabled={isAiLoading} className="w-full py-1.5 bg-white/20 hover:bg-white/30 rounded-lg text-xs font-bold transition-colors relative z-10">
                                {isAiLoading ? <i className="fa-solid fa-rotate-right animate-spin"></i> : <><i className="fa-solid fa-bolt text-yellow-300 mr-1"></i> AI応援を頼む！</>}
                            </button>
                        </div>

                        {/* ナビゲーションメニュー */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-2 flex flex-col gap-1">
                            <button onClick={() => setCurrentView('dashboard')} className={`text-left px-4 py-2 text-sm font-bold rounded flex items-center transition-colors ${currentView === 'dashboard' ? 'bg-primary/10 text-primary' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-list-check w-5"></i> タスクボード</button>
                            <button onClick={() => setCurrentView('analytics')} className={`text-left px-4 py-2 text-sm font-bold rounded flex items-center transition-colors ${currentView === 'analytics' ? 'bg-primary/10 text-primary' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-chart-line w-5"></i> 分析・ダッシュボード</button>
                            <button onClick={() => { setCurrentView('github'); if(githubFiles.length===0) fetchGithubPath(); }} className={`text-left px-4 py-2 text-sm font-bold rounded flex items-center transition-colors ${currentView === 'github' ? 'bg-primary/10 text-primary' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-folder-open w-5"></i> クラウドファイル</button>
                            <button onClick={() => setCurrentView('trash')} className={`text-left px-4 py-2 text-sm font-bold rounded flex items-center transition-colors ${currentView === 'trash' ? 'bg-rose-100 text-rose-600' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-trash-can w-5"></i> ごみ箱</button>
                            <button onClick={() => setCurrentView('settings')} className={`text-left px-4 py-2 text-sm font-bold rounded flex items-center transition-colors ${currentView === 'settings' ? 'bg-slate-100 text-slate-700 dark:bg-slate-700' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-gear w-5"></i> 設定</button>
                        </div>

                        {/* 同期ToDo (複数＆入力安定化) */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3">
                            <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-2 text-sm"><i className="fa-solid fa-check-double text-primary mr-2"></i>同期ToDo</h3>
                            <div className="max-h-32 overflow-y-auto space-y-1 mb-2">
                                {todos.map(todo => (
                                    <div key={todo.id} className="flex items-center gap-2 text-sm group">
                                        <input type="checkbox" checked={todo.completed} onChange={() => setTodos(todos.map(t => t.id === todo.id ? {...t, completed: !t.completed} : t))} />
                                        <LocalInput value={todo.text} onChange={(val) => setTodos(todos.map(t => t.id === todo.id ? {...t, text: val} : t))} className={`flex-1 bg-transparent border-none p-0 focus:ring-0 ${todo.completed ? 'line-through text-slate-400' : 'dark:text-slate-200'}`} />
                                        <button onClick={() => setTodos(todos.filter(t => t.id !== todo.id))} className="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => setTodos([...todos, {id: Date.now(), text: '新規', completed: false}])} className="text-xs text-primary font-bold"><i className="fa-solid fa-plus mr-1"></i>追加</button>
                        </div>

                        {/* 複数タブ同期メモ */}
                        <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3 flex flex-col flex-1">
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-bold text-slate-700 dark:text-slate-200 text-sm"><i className="fa-regular fa-file-lines text-amber-500 mr-2"></i>同期メモ</h3>
                                <button onClick={() => { const newM = {id: Date.now(), title: '新規', content: ''}; setMemos([...memos, newM]); setCurrentMemoId(newM.id); }} className="text-xs text-amber-600"><i className="fa-solid fa-plus"></i></button>
                            </div>
                            {memos.length > 0 && (
                                <div className="flex gap-1 mb-2">
                                    <select className="flex-1 text-xs p-1 border rounded dark:bg-slate-700 dark:border-slate-600 dark:text-slate-200" value={currentMemoId || ''} onChange={e => setCurrentMemoId(Number(e.target.value))}>
                                        {memos.map(m => <option key={m.id} value={m.id}>{m.title}</option>)}
                                    </select>
                                    <button onClick={() => { if(confirm('削除しますか？')) { const nm = memos.filter(m => m.id !== currentMemoId); setMemos(nm); setCurrentMemoId(nm.length?nm[0].id:null); } }} className="text-rose-500 p-1"><i className="fa-solid fa-trash"></i></button>
                                </div>
                            )}
                            {currentMemoId && (
                                <div className="flex flex-col flex-1 gap-1">
                                    <LocalInput value={activeMemo.title} onChange={(val) => handleMemoUpdate(currentMemoId, 'title', val)} className="text-xs font-bold bg-transparent border-b focus:ring-0 dark:text-slate-200 dark:border-slate-700 p-1" placeholder="タイトル"/>
                                    <LocalInput isTextarea value={activeMemo.content} onChange={(val) => handleMemoUpdate(currentMemoId, 'content', val)} className="w-full flex-1 min-h-[80px] p-2 text-sm border rounded bg-slate-50 dark:bg-slate-900 resize-none dark:text-slate-200 dark:border-slate-700 focus:ring-1 focus:ring-amber-500" placeholder="内容..."/>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const TaskList = ({ type, title, icon }) => {
                const [isExpanded, setIsExpanded] = useState(type !== 'completed');
                let list = tasks.filter(t => t.type === type && t.status === 'active');
                if (activeTagFilter) list = list.filter(t => t.tags?.includes(activeTagFilter));
                list.sort((a, b) => (!a.dueDate ? 1 : !b.dueDate ? -1 : new Date(a.dueDate) - new Date(b.dueDate)));
                if (type === 'completed') list = tasks.filter(t => t.status === 'completed');

                // D&D Handlers
                const handleDragStart = (e, id) => { e.dataTransfer.setData('taskId', id); e.target.classList.add('opacity-50'); };
                const handleDrop = (e, targetId) => {
                    e.preventDefault(); const sourceId = e.dataTransfer.getData('taskId');
                    if (sourceId === targetId) return;
                    const newTasks = [...tasks], sIdx = newTasks.findIndex(t => t.id === sourceId), tIdx = newTasks.findIndex(t => t.id === targetId);
                    if(sIdx < 0 || tIdx < 0) return;
                    const [moved] = newTasks.splice(sIdx, 1); newTasks.splice(tIdx, 0, moved); setTasks(newTasks);
                };

                return (
                  <div className="mb-6">
                    <div className="flex items-center justify-between border-b-2 border-slate-200 dark:border-slate-700 pb-1 mb-3 group">
                        <h2 onClick={() => setIsExpanded(!isExpanded)} className="text-lg font-bold text-slate-700 dark:text-slate-200 flex items-center cursor-pointer select-none flex-1">
                            <i className={`${icon} mr-2`}></i> {title} <span className="text-sm ml-2 text-slate-400">({list.length})</span>
                            <i className={`fa-solid fa-chevron-${isExpanded ? 'down' : 'right'} ml-2 text-xs text-slate-300 group-hover:text-slate-500`}></i>
                        </h2>
                        {type !== 'completed' && <button onClick={() => setTasks([...tasks, { id: Date.now().toString(), title: '新規タスク', type, status: 'active', subtasks: [], tags: [], isSecret: false, streak: 0 }])} className="text-xs bg-primary/10 text-primary px-3 py-1 rounded-full"><i className="fa-solid fa-plus mr-1"></i>追加</button>}
                    </div>
                    {isExpanded && (
                        <div className="space-y-2">
                        {list.map((task) => {
                            const progress = task.subtasks?.length ? Math.round((task.subtasks.filter(s => s.status === 'completed').length / task.subtasks.length) * 100) : 0;
                            const isHidden = task.isSecret && !isUnlocked;
                            return (
                                <div key={task.id} draggable={type !== 'completed'} onDragStart={(e) => handleDragStart(e, task.id)} onDragEnd={(e) => e.target.classList.remove('opacity-50')} onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDrop(e, task.id)}
                                    className="group flex items-center justify-between p-2 rounded-lg border bg-white dark:bg-slate-800 hover:shadow-md cursor-grab active:cursor-grabbing dark:border-slate-700">
                                    <div className="flex items-center gap-3 flex-1 overflow-hidden">
                                        <button onClick={() => toggleTaskStatus(task.id)} className="flex-shrink-0 text-slate-400 hover:text-emerald-500">
                                            {task.status === 'completed' ? <i className="fa-solid fa-circle-check text-emerald-500 text-xl"></i> : <i className="fa-regular fa-circle text-xl"></i>}
                                        </button>
                                        <div className="flex-1 cursor-pointer truncate" onClick={() => {
                                            if (isHidden) { const p = prompt("PIN:"); if (p === pinCode) { setIsUnlocked(true); setSelectedTaskId(task.id); setCurrentView('taskDetail'); } else if(p!==null) alert("NG"); } 
                                            else { setSelectedTaskId(task.id); setCurrentView('taskDetail'); }
                                        }}>
                                            <div className="flex items-center gap-2">
                                                <p className={`font-semibold truncate text-sm md:text-base ${task.status === 'completed' ? 'line-through text-slate-400' : ''}`}>{isHidden ? "🔒 秘密" : task.title}</p>
                                                {!isHidden && task.streak > 0 && <span className="text-[10px] font-bold text-orange-500 bg-orange-100 px-1 rounded flex items-center"><i className="fa-solid fa-fire mr-0.5"></i>{task.streak}</span>}
                                            </div>
                                            {!isHidden && (
                                                <div className="flex text-[11px] text-slate-500 gap-3 mt-0.5">
                                                    {task.dueDate && <span><i className="fa-regular fa-calendar mr-1"></i>{task.dueDate}</span>}
                                                    {progress > 0 && <span>進捗: {progress}%</span>}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
                                        {type === 'completed' ? <button onClick={() => { if(confirm('履歴から消去？')) setTasks(tasks.filter(t => t.id !== task.id)); }} className="p-2 text-slate-300 hover:text-rose-500"><i className="fa-solid fa-xmark"></i></button>
                                        : <button onClick={() => setTasks(tasks.map(t => t.id === task.id ? { ...t, status: 'trash' } : t))} className="p-2 text-slate-300 hover:text-rose-500"><i className="fa-solid fa-trash-can"></i></button>}
                                    </div>
                                </div>
                            )
                        })}
                        {list.length === 0 && <p className="text-slate-400 text-sm italic pl-2">なし</p>}
                        </div>
                    )}
                  </div>
                );
            };

            const Dashboard = () => {
                const tags = Array.from(new Set(tasks.flatMap(t => t.tags || [])));
                return (
                    <div className="flex-1 min-w-0">
                        {aiMessage && <div className="mb-4 bg-gradient-to-r from-yellow-100 to-orange-100 dark:from-yellow-900/40 border-l-4 border-yellow-400 p-3 rounded text-orange-800 dark:text-orange-200 font-bold animate-bounce"><i className="fa-solid fa-robot mr-2"></i>{aiMessage}</div>}
                        
                        {/* タグフィルター */}
                        {tags.length > 0 && (
                            <div className="mb-4 flex gap-1 flex-wrap">
                                <button onClick={() => setActiveTagFilter(null)} className={`text-xs px-2 py-1 rounded-full border ${activeTagFilter === null ? 'bg-primary text-white border-primary' : 'bg-white dark:bg-slate-800 text-slate-500 dark:border-slate-700'}`}>すべて</button>
                                {tags.map(tag => <button key={tag} onClick={() => setActiveTagFilter(tag)} className={`text-xs px-2 py-1 rounded-full border ${activeTagFilter === tag ? 'bg-primary text-white border-primary' : 'bg-white dark:bg-slate-800 text-slate-500 dark:border-slate-700'}`}>#{tag}</button>)}
                            </div>
                        )}

                        <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                            <div className="xl:col-span-2 space-y-2">
                                <TaskList type="normal" title="メインタスク" icon="fa-solid fa-circle-check text-primary" />
                                <TaskList type="someday" title="いつかやる" icon="fa-regular fa-clock text-amber-500" />
                                <TaskList type="routine" title="日課・ルーチン" icon="fa-solid fa-rotate-right text-emerald-500" />
                                <div className="mt-8 opacity-70"><TaskList type="completed" title="完了履歴" icon="fa-solid fa-clock-rotate-left text-slate-400" /></div>
                            </div>
                            <div>
                                {/* スケジュール */}
                                <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 sticky top-4">
                                    <h2 className="text-base font-bold mb-3 flex items-center"><i className="fa-regular fa-calendar text-blue-500 mr-2"></i>スケジュール</h2>
                                    <div className="space-y-2 max-h-[300px] overflow-y-auto pr-1">
                                        {schedules.map(sc => (
                                            <div key={sc.id} className="flex flex-col gap-1 text-sm border-b pb-2 dark:border-slate-700">
                                                <div className="flex gap-2">
                                                    <input type="date" className="border rounded p-1 text-xs dark:bg-slate-700 dark:border-slate-600" value={sc.date} onChange={e => setSchedules(schedules.map(s => s.id === sc.id ? {...s, date: e.target.value} : s))}/>
                                                    <button onClick={() => setSchedules(schedules.filter(s => s.id !== sc.id))} className="text-rose-400 ml-auto hover:text-rose-600"><i className="fa-solid fa-xmark"></i></button>
                                                </div>
                                                <LocalInput value={sc.title} onChange={(val) => setSchedules(schedules.map(s => s.id === sc.id ? {...s, title: val} : s))} className="w-full bg-slate-50 dark:bg-slate-900 rounded p-1.5 focus:ring-1 border-none" placeholder="予定内容"/>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => setSchedules([...schedules, {id: Date.now().toString(), title: '', date: ''}])} className="mt-3 text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg w-full font-bold dark:bg-blue-900/30 hover:bg-blue-100 transition-colors"><i className="fa-solid fa-plus mr-1"></i>追加</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const TaskDetail = () => {
                const task = tasks.find(t => t.id === selectedTaskId);
                const [bgmType, setBgmType] = useState('none');
                const [tagInput, setTagInput] = useState('');
                useEffect(() => { return () => stopBGM(); }, []);
                if (!task) return null;

                const updateTask = (updates) => setTasks(tasks.map(t => t.id === task.id ? { ...t, ...updates } : t));
                const progress = task.subtasks?.length > 0 ? Math.round((task.subtasks.filter(s => s.status === 'completed').length / task.subtasks.length) * 100) : 0;

                if (isFocusMode) {
                    return (
                        <div className="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
                            <button onClick={() => { setIsFocusMode(false); stopBGM(); }} className="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800 p-3 rounded-full"><i className="fa-solid fa-xmark text-xl"></i></button>
                            <h2 className="text-white text-xl mb-2 opacity-50"><i className="fa-solid fa-headphones mr-2"></i>集中モード</h2>
                            <p className="text-3xl font-bold text-white mb-8 text-center">{task.title}</p>
                            
                            <div className="flex gap-2 mb-8 bg-slate-800 p-2 rounded-full">
                                <button onClick={()=>{setBgmType('none'); stopBGM();}} className={`px-4 py-1 rounded-full text-sm font-bold ${bgmType==='none'?'bg-primary text-white':'text-slate-400'}`}>無音</button>
                                <button onClick={()=>{setBgmType('rain'); playBGM('rain');}} className={`px-4 py-1 rounded-full text-sm font-bold ${bgmType==='rain'?'bg-primary text-white':'text-slate-400'}`}><i className="fa-solid fa-cloud-rain mr-1"></i>雨</button>
                                <button onClick={()=>{setBgmType('cafe'); playBGM('cafe');}} className={`px-4 py-1 rounded-full text-sm font-bold ${bgmType==='cafe'?'bg-primary text-white':'text-slate-400'}`}><i className="fa-solid fa-mug-hot mr-1"></i>カフェ</button>
                            </div>
                            
                            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
                                <h3 className="text-slate-400 text-sm font-bold border-b border-slate-800 pb-2 mb-4">残りの細分項目</h3>
                                <div className="space-y-3 max-h-60 overflow-y-auto">
                                    {task.subtasks.filter(s => s.status !== 'completed').map(sub => (
                                        <div key={sub.id} className="flex items-start gap-3 p-3 bg-slate-800 rounded-xl">
                                            <button onClick={() => { updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, status: 'completed'} : s) }); logActivityAndGainXP(); }} className="mt-0.5 text-slate-500 hover:text-emerald-400"><i className="fa-regular fa-circle text-2xl"></i></button>
                                            <span className="text-slate-200 flex-1 leading-tight">{sub.title}</span>
                                        </div>
                                    ))}
                                    {task.subtasks.filter(s => s.status !== 'completed').length === 0 && <p className="text-emerald-400 font-bold text-center py-4">すべて完了！</p>}
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="flex-1 min-w-0 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 md:p-8">
                        <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-100 dark:border-slate-700">
                            <button onClick={() => setCurrentView('dashboard')} className="text-slate-500 hover:text-primary font-medium"><i className="fa-solid fa-arrow-left mr-2"></i>戻る</button>
                            <div className="flex gap-2">
                                <button onClick={() => updateTask({ isSecret: !task.isSecret })} className={`p-2 rounded ${task.isSecret ? 'text-rose-500 bg-rose-50 dark:bg-rose-900/30' : 'text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700'}`} title="秘密にする"><i className={`fa-solid ${task.isSecret ? 'fa-lock' : 'fa-lock-open'}`}></i></button>
                                <button onClick={() => setIsFocusMode(true)} className="px-4 py-2 bg-primary/10 text-primary rounded hover:bg-primary/20 font-bold text-sm"><i className="fa-solid fa-expand mr-2"></i>集中</button>
                            </div>
                        </div>

                        <LocalInput value={task.title} onChange={(val) => updateTask({ title: val })} className="w-full text-2xl md:text-3xl font-extrabold bg-transparent border-none focus:ring-0 mb-4 p-0 dark:text-slate-100" placeholder="タスク名を入力..." />

                        {/* 締切とタグ */}
                        <div className="flex flex-wrap items-center gap-4 mb-6 bg-slate-50 dark:bg-slate-900 p-3 rounded-lg border dark:border-slate-700">
                            <div className="flex items-center">
                                <i className="fa-regular fa-calendar text-slate-400 mr-2"></i>
                                <span className="text-sm font-bold text-slate-600 dark:text-slate-300 mr-2">締め切り:</span>
                                <input type="date" className="bg-white dark:bg-slate-800 border rounded px-2 py-1 text-sm dark:border-slate-600 dark:text-slate-200 cursor-pointer" value={task.dueDate || ''} onChange={(e) => updateTask({ dueDate: e.target.value })}/>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap border-l pl-4 dark:border-slate-700">
                                <i className="fa-solid fa-tag text-slate-400"></i>
                                {task.tags?.map(tag => (
                                    <span key={tag} className="bg-primary/10 text-primary px-2 py-1 rounded-full text-xs flex items-center">
                                        #{tag} <button onClick={() => updateTask({ tags: task.tags.filter(t => t !== tag) })} className="ml-1 opacity-50 hover:opacity-100"><i className="fa-solid fa-xmark"></i></button>
                                    </span>
                                ))}
                                <input type="text" value={tagInput} onChange={e => setTagInput(e.target.value)}
                                    onKeyDown={(e) => { if(e.key === 'Enter' && tagInput.trim()) { updateTask({ tags: [...new Set([...(task.tags||[]), tagInput.trim().replace(/^#/,'')])]}); setTagInput(''); } }}
                                    placeholder="タグ追加(Enter)" className="text-xs bg-white dark:bg-slate-800 border rounded px-2 py-1 w-28 dark:border-slate-600 dark:text-slate-200" />
                            </div>
                        </div>

                        <div className="flex items-center gap-4 mb-6">
                            <div className="flex-1">
                                <div className="flex justify-between text-xs mb-1 font-bold text-slate-500"><span>進捗状況</span><span>{progress}%</span></div>
                                <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2"><div className="bg-emerald-500 h-2 rounded-full transition-all" style={{ width: `${progress}%` }}></div></div>
                            </div>
                            <button onClick={() => generateAiMilestones(task)} disabled={isAiLoading} className="px-3 py-1.5 border border-primary text-primary rounded hover:bg-primary/10 text-xs font-bold transition-colors">
                                {isAiLoading ? <i className="fa-solid fa-rotate-right animate-spin"></i> : <><i className="fa-solid fa-robot mr-1"></i> AIマイルストーン</>}
                            </button>
                        </div>

                        {/* 細分項目 (チラつき防止) */}
                        <h3 className="font-bold mb-3 text-slate-700 dark:text-slate-200"><i className="fa-regular fa-square-check text-emerald-500 mr-2"></i>細分項目</h3>
                        <div className="space-y-2 mb-8">
                            {task.subtasks.map((sub) => (
                                <div key={sub.id} className="flex items-start gap-2 p-3 bg-slate-50 dark:bg-slate-900 rounded-lg group border dark:border-slate-700">
                                    <button onClick={() => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, status: s.status==='active'?'completed':'active'} : s) })} className="mt-1 text-slate-400 hover:text-emerald-500">
                                        {sub.status === 'completed' ? <i className="fa-solid fa-circle-check text-emerald-500"></i> : <i className="fa-regular fa-circle"></i>}
                                    </button>
                                    <div className="flex-1 flex flex-col gap-1">
                                        <LocalInput value={sub.title} onChange={(val) => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, title: val} : s) })} className={`w-full bg-transparent border-none p-0 focus:ring-0 ${sub.status === 'completed' ? 'line-through text-slate-400' : 'font-semibold dark:text-slate-200'}`} placeholder="項目名..." />
                                        <LocalInput value={sub.memo||''} onChange={(val) => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, memo: val} : s) })} className="w-full bg-transparent border-none p-0 focus:ring-0 text-xs text-slate-500" placeholder="メモ..." />
                                    </div>
                                    <button onClick={() => updateTask({ subtasks: task.subtasks.filter(s => s.id !== sub.id) })} className="opacity-0 group-hover:opacity-100 text-rose-400 p-1 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                            ))}
                            <button onClick={() => updateTask({ subtasks: [...task.subtasks, { id: Date.now().toString(), title: '', status: 'active' }] })} className="w-full py-2 border border-dashed rounded text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 dark:border-slate-600 text-sm font-bold"><i className="fa-solid fa-plus mr-1"></i>追加</button>
                        </div>

                        <h3 className="font-bold mb-2 text-slate-700 dark:text-slate-200"><i className="fa-regular fa-file-lines text-amber-500 mr-2"></i>タスク詳細メモ</h3>
                        <LocalInput isTextarea value={task.memo||''} onChange={(val) => updateTask({ memo: val })} className="w-full h-40 p-3 bg-slate-50 dark:bg-slate-900 border rounded-lg text-sm resize-y focus:ring-1 focus:ring-primary dark:border-slate-700 dark:text-slate-200" placeholder="詳細や参考リンクなどを記録..." />
                    </div>
                );
            };

            // 分析ダッシュボード (新機能)
            const AnalyticsView = () => {
                const totalCompleted = tasks.filter(t => t.status === 'completed').length;
                const completedRoutines = tasks.filter(t => t.type === 'routine' && t.status === 'completed').length;
                return (
                    <div className="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8">
                        <h1 className="text-2xl font-bold mb-6"><i className="fa-solid fa-chart-line text-primary mr-3"></i>分析ダッシュボード</h1>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                            <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-center bg-slate-50 dark:bg-slate-900">
                                <p className="text-xs text-slate-500 font-bold mb-1">現在のレベル</p><p className="text-3xl font-extrabold text-primary">{userStats.level}</p>
                            </div>
                            <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-center bg-slate-50 dark:bg-slate-900">
                                <p className="text-xs text-slate-500 font-bold mb-1">総経験値 (XP)</p><p className="text-3xl font-extrabold text-yellow-500">{userStats.xp + ((userStats.level-1)*50)}</p>
                            </div>
                            <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-center bg-slate-50 dark:bg-slate-900">
                                <p className="text-xs text-slate-500 font-bold mb-1">完了タスク総数</p><p className="text-3xl font-extrabold text-emerald-500">{totalCompleted}</p>
                            </div>
                            <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-center bg-slate-50 dark:bg-slate-900">
                                <p className="text-xs text-slate-500 font-bold mb-1">本日の日課達成</p><p className="text-3xl font-extrabold text-rose-500">{completedRoutines}</p>
                            </div>
                        </div>

                        <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-4"><i className="fa-solid fa-fire text-orange-500 mr-2"></i>アクティビティヒートマップ</h3>
                        <div className="flex flex-wrap gap-1 p-4 border rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700">
                            {[...Array(60)].map((_, i) => {
                                const d = new Date(); d.setDate(d.getDate() - (59 - i));
                                const dateStr = d.toISOString().split('T')[0];
                                const count = activityLog[dateStr] || 0;
                                let color = 'bg-slate-200 dark:bg-slate-700';
                                if (count > 0) color = 'bg-primary opacity-40';
                                if (count > 2) color = 'bg-primary opacity-70';
                                if (count > 5) color = 'bg-primary opacity-100';
                                return <div key={i} title={`${dateStr}: ${count}件`} className={`w-3 h-3 md:w-4 md:h-4 rounded-sm ${color}`}></div>
                            })}
                        </div>
                    </div>
                );
            };

            // GitHub Folder View (新機能)
            const GithubView = () => {
                if(!githubSettings.token) return (
                    <div className="flex-1 p-8 text-center bg-white dark:bg-slate-800 rounded-2xl border dark:border-slate-700">
                        <i className="fa-brands fa-github text-6xl text-slate-300 mb-4"></i>
                        <p className="font-bold mb-4">GitHub連携が未設定です。</p>
                        <button onClick={() => setCurrentView('settings')} className="bg-primary text-white px-4 py-2 rounded">設定画面へ</button>
                    </div>
                );

                const handleDropUpload = (e) => {
                    e.preventDefault(); e.currentTarget.classList.remove('dragging');
                    if(e.dataTransfer.files && e.dataTransfer.files.length > 0) uploadToGithub(e.dataTransfer.files[0]);
                };

                return (
                    <div className="flex-1 flex flex-col min-w-0 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8">
                        <div className="flex items-center justify-between mb-6">
                            <h1 className="text-2xl font-bold"><i className="fa-brands fa-github mr-3 text-slate-600 dark:text-slate-300"></i>クラウドファイル</h1>
                            <div className="flex gap-2">
                                <button onClick={createGithubFolder} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 rounded text-sm font-bold"><i className="fa-solid fa-folder-plus mr-1"></i>新規フォルダ</button>
                                <button onClick={() => fetchGithubPath(githubPath)} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 rounded text-sm font-bold"><i className="fa-solid fa-rotate-right"></i></button>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 mb-4 p-2 bg-slate-50 dark:bg-slate-900 rounded border dark:border-slate-700 text-sm font-mono overflow-x-auto">
                            <button onClick={() => fetchGithubPath('')} className="text-primary hover:underline"><i className="fa-solid fa-house"></i></button>
                            {githubPath.split('/').filter(Boolean).map((p, i, arr) => (
                                <React.Fragment key={p}>
                                    <span className="text-slate-400">/</span>
                                    <button onClick={() => fetchGithubPath(arr.slice(0, i+1).join('/'))} className="text-primary hover:underline">{p}</button>
                                </React.Fragment>
                            ))}
                        </div>

                        <div 
                            className="flex-1 border-2 border-dashed border-slate-200 dark:border-slate-600 rounded-xl p-4 overflow-y-auto transition-colors bg-slate-50/50 dark:bg-slate-900/50"
                            onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('dragging'); }}
                            onDragLeave={(e) => e.currentTarget.classList.remove('dragging')}
                            onDrop={handleDropUpload}
                        >
                            {isGithubLoading ? <p className="text-center text-slate-400 py-10"><i className="fa-solid fa-circle-notch fa-spin text-2xl"></i></p> : (
                                <div className="space-y-1">
                                    {githubFiles.length === 0 && <p className="text-center text-slate-400 py-10 text-sm">ファイルはありません<br/>ここにドラッグ＆ドロップでアップロードできます</p>}
                                    {githubFiles.map(file => (
                                        <div key={file.sha} className="flex justify-between items-center p-2 hover:bg-white dark:hover:bg-slate-800 rounded border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                                            <div className="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onClick={() => file.type === 'dir' ? fetchGithubPath(file.path) : window.open(file.download_url, '_blank')}>
                                                {file.type === 'dir' ? <i className="fa-solid fa-folder text-amber-400 text-lg"></i> : <i className="fa-regular fa-file-lines text-slate-400 text-lg"></i>}
                                                <span className="text-sm font-semibold truncate">{file.name}</span>
                                            </div>
                                            {file.type === 'file' && <a href={file.download_url} target="_blank" className="text-slate-400 hover:text-primary p-2"><i className="fa-solid fa-download"></i></a>}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const TrashView = () => (
                <div className="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8">
                    <h1 className="text-2xl font-bold mb-6"><i className="fa-solid fa-trash-can text-rose-500 mr-3"></i>ごみ箱</h1>
                    {tasks.filter(t => t.status === 'trash').length === 0 ? <p className="text-center text-slate-400 my-10">ごみ箱は空です</p> : (
                        <div className="space-y-2">
                            {tasks.filter(t => t.status === 'trash').map(task => (
                                <div key={task.id} className="flex justify-between items-center p-3 border dark:border-slate-700 rounded bg-slate-50 dark:bg-slate-900">
                                    <span className="text-slate-500 line-through truncate">{task.title}</span>
                                    <div className="flex gap-2 ml-4 flex-shrink-0">
                                        <button onClick={() => setTasks(tasks.map(t => t.id === task.id ? {...t, status: 'active'} : t))} className="px-3 py-1 bg-emerald-100 text-emerald-700 rounded text-xs dark:bg-emerald-900/30 dark:text-emerald-400"><i className="fa-solid fa-rotate-left mr-1"></i>復元</button>
                                        <button onClick={() => setTasks(tasks.filter(t => t.id !== task.id))} className="px-3 py-1 bg-rose-100 text-rose-700 rounded text-xs dark:bg-rose-900/30 dark:text-rose-400">完全に削除</button>
                                    </div>
                                </div>
                            ))}
                            <button onClick={() => setTasks(tasks.filter(t => t.status !== 'trash'))} className="mt-6 px-4 py-2 bg-rose-500 text-white rounded font-bold text-sm w-full md:w-auto md:float-right">ごみ箱を空にする</button>
                        </div>
                    )}
                </div>
            );

            const SettingsView = () => {
                const qrRef = useRef(null);
                useEffect(() => {
                    if(qrRef.current && typeof QRCode !== 'undefined') {
                        qrRef.current.innerHTML = '';
                        const exportData = { lv: userStats.level, xp: userStats.xp, t: tasks.filter(t=>t.status==='active').slice(0,5).map(t=>({id:t.id, title:t.title})) };
                        const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(exportData))));
                        new QRCode(qrRef.current, { text: `taskmaster://sync?d=${dataStr.substring(0, 500)}`, width: 160, height: 160, colorDark : "#1e293b", colorLight : "#ffffff" });
                    }
                }, [currentView]);

                return (
                    <div className="flex-1 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8 space-y-6">
                        <h1 className="text-2xl font-bold mb-6"><i className="fa-solid fa-gear text-slate-500 mr-3"></i>設定・連携</h1>
                        
                        {/* JSONインポート機能 (hub_backup.json対応) */}
                        <div className="p-4 border rounded-xl bg-amber-50 dark:bg-amber-900/10 border-amber-200 dark:border-amber-800/50">
                            <h3 className="font-bold mb-2 flex items-center text-amber-700 dark:text-amber-500"><i className="fa-solid fa-file-import mr-2"></i>外部データ (JSON) インポート</h3>
                            <p className="text-xs text-slate-600 dark:text-slate-400 mb-3">hub_backup.json等のバックアップファイルからデータを読み込みます。</p>
                            <input type="file" accept=".json" onChange={importJSONData} className="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200 cursor-pointer"/>
                        </div>

                        {/* テーマカラー変更 */}
                        <div className="p-4 border rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700">
                            <h3 className="font-bold mb-3 flex items-center"><i className="fa-solid fa-palette text-primary mr-2"></i>カスタムテーマカラー</h3>
                            <div className="flex gap-3">
                                {[{c:'indigo', hex:'#6366f1'}, {c:'emerald', hex:'#10b981'}, {c:'rose', hex:'#f43f5e'}, {c:'amber', hex:'#f59e0b'}, {c:'slate', hex:'#64748b'}].map(color => (
                                    <button key={color.c} onClick={() => { setThemeColor(`theme-${color.c}`); document.documentElement.className = `${isDarkMode?'dark':'light'} theme-${color.c}`; }} 
                                        className={`w-8 h-8 rounded-full border-2 transition-transform ${themeColor === `theme-${color.c}` ? 'scale-125 border-slate-800 dark:border-white' : 'border-transparent'}`} style={{backgroundColor: color.hex}}></button>
                                ))}
                            </div>
                        </div>

                        <div className="p-4 border rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700">
                            <h3 className="font-bold mb-2 flex items-center"><i className="fa-solid fa-lock text-rose-500 mr-2"></i>シークレットPIN (タスクロック用)</h3>
                            <div className="flex gap-2">
                                <input type="password" value={pinCode} onChange={e => setPinCode(e.target.value)} onBlur={() => localStorage.setItem('taskMaster_pin', pinCode)} placeholder="数字や文字" className="border p-2 rounded w-full max-w-xs dark:bg-slate-800 dark:border-slate-600"/>
                                {pinCode && <button onClick={() => setIsUnlocked(!isUnlocked)} className="px-4 py-2 bg-primary/10 text-primary rounded text-sm font-bold">{isUnlocked ? "ロックする" : "ロック解除中"}</button>}
                            </div>
                        </div>

                        <div className="p-4 border rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700">
                            <h3 className="font-bold mb-2 flex items-center"><i className="fa-brands fa-github mr-2"></i>GitHub連携バックアップ</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                                <input type="password" placeholder="Personal Access Token" className="border p-2 rounded dark:bg-slate-800 text-sm" value={githubSettings.token} onChange={e => setGithubSettings({...githubSettings, token: e.target.value})}/>
                                <div className="flex gap-2">
                                    <input type="text" placeholder="Owner" className="w-1/2 border p-2 rounded dark:bg-slate-800 text-sm" value={githubSettings.owner} onChange={e => setGithubSettings({...githubSettings, owner: e.target.value})}/>
                                    <input type="text" placeholder="Repo" className="w-1/2 border p-2 rounded dark:bg-slate-800 text-sm" value={githubSettings.repo} onChange={e => setGithubSettings({...githubSettings, repo: e.target.value})}/>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <button onClick={() => { const nd = !isDarkMode; setIsDarkMode(nd); document.documentElement.classList.toggle('dark', nd); }} className="p-4 border rounded-xl text-center hover:bg-slate-50 dark:hover:bg-slate-700 dark:border-slate-700 transition-colors">
                                <i className={`fa-solid ${isDarkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-500'} text-2xl mb-2`}></i><br/><span className="text-sm font-bold">モード切替</span>
                            </button>
                            <button onClick={() => {
                                const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ tasks, schedules, userStats, memos, todos })], { type: 'application/json' })); a.download = 'taskmaster_backup.json'; a.click();
                            }} className="p-4 border rounded-xl text-center hover:bg-slate-50 dark:hover:bg-slate-700 dark:border-slate-700 transition-colors">
                                <i className="fa-solid fa-download text-emerald-500 text-2xl mb-2"></i><br/><span className="text-sm font-bold">全データ保存</span>
                            </button>
                            <div className="col-span-2 p-4 border rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 flex flex-col items-center justify-center">
                                <p className="text-xs font-bold mb-2">スマホ引継ぎ用QR</p>
                                <div ref={qrRef} className="p-2 bg-white rounded shadow-sm"></div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row gap-4 p-2 md:p-4 lg:p-6 max-w-7xl mx-auto">
                    <Sidebar />
                    <div className="flex-1 min-w-0">
                        {currentView === 'dashboard' && <Dashboard />}
                        {currentView === 'taskDetail' && <TaskDetail />}
                        {currentView === 'trash' && <TrashView />}
                        {currentView === 'settings' && <SettingsView />}
                        {currentView === 'analytics' && <AnalyticsView />}
                        {currentView === 'github' && <GithubView />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
