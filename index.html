                                    <div className="bg-gradient-to-r from-primary to-primary-dark p-5 text-white flex justify-between items-center relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-24 h-24 bg-white opacity-10 rounded-full -mr-8 -mt-8"></div>
                                        <h3 className="text-xl font-bold relative z-10"><i className="fa-regular fa-calendar-check mr-2"></i>{selectedDayDetails.replace(/-/g, '/')} の予定</h3>
                                        <button onClick={() => setSelectedDayDetails(null)} className="relative z-10 w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-colors"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                    <div className="p-6">
                                        {/* ★ スタンプ個別削除 */}
                                        {(calendarStamps[selectedDayDetails] || []).length > 0 && (
                                            <div className="mb-6 pb-4 border-b border-slate-100 dark:border-slate-700">
                                                <p className="text-xs font-bold text-slate-400 mb-2"><i className="fa-solid fa-stamp mr-1"></i>スタンプ (クリックで削除)</p>
                                                <div className="flex flex-wrap gap-2">
                                                    {(calendarStamps[selectedDayDetails] || []).map((stampId, idx) => {
                                                        const btnDef = calendarButtons.find(b => b.id === stampId || b.text === stampId);
                                                        const text = btnDef ? btnDef.text : stampId; const color = btnDef ? btnDef.color : '#f59e0b';
                                                        return (
                                                            <span key={idx} className="pl-3 pr-1 py-1 rounded-lg text-white font-bold text-sm shadow-sm flex items-center gap-1" style={{backgroundColor: color}}>
                                                                {text}
                                                                <button onClick={() => {
                                                                    setCalendarStamps(prev => {
                                                                        const newStamps = [...(prev[selectedDayDetails] || [])]; newStamps.splice(idx, 1);
                                                                        return { ...prev, [selectedDayDetails]: newStamps };
                                                                    });
                                                                }} className="w-5 h-5 rounded-full hover:bg-black/20 flex items-center justify-center transition-colors"><i className="fa-solid fa-xmark text-[10px]"></i></button>
                                                            </span>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}

                                        {/* タイムライン */}
                                        <div>
                                            <p className="text-xs font-bold text-slate-400 mb-3"><i className="fa-solid fa-list mr-1"></i>スケジュール</p>
                                            <div className="space-y-4 max-h-64 overflow-y-auto pr-2">
                                                {schedules.filter(sc => {
                                                    if (!sc.date) return false; const start = sc.date; const end = sc.endDate || sc.date;
                                                    return selectedDayDetails >= start && selectedDayDetails <= end;
                                                }).sort((a, b) => {
                                                    const timeA = (a.date === selectedDayDetails ? a.time : '00:00') || '00:00';
                                                    const timeB = (b.date === selectedDayDetails ? b.time : '00:00') || '00:00';
                                                    return timeA.localeCompare(timeB) || a.id.localeCompare(b.id);
                                                }).map((sc, i, arr) => {
                                                    let timeLabel = sc.time || '終日';
                                                    if (sc.date !== sc.endDate) {
                                                        if (sc.date === selectedDayDetails) timeLabel = sc.time ? `${sc.time}〜` : '開始';
                                                        else if (sc.endDate === selectedDayDetails) timeLabel = sc.endTime ? `〜${sc.endTime}` : '終了';
                                                        else timeLabel = '期間中';
                                                    }
                                                    return (
                                                        <div key={sc.id} className="flex gap-3 relative group">
                                                            {i !== arr.length - 1 && <div className="absolute left-[27px] top-8 bottom-[-16px] w-0.5 bg-slate-200 dark:bg-slate-700"></div>}
                                                            <div className="w-[54px] text-right pt-0.5"><span className="text-xs font-bold text-primary truncate block">{timeLabel}</span></div>
                                                            <div className="flex-1 bg-slate-50 dark:bg-slate-900 rounded-xl p-3 border border-slate-100 dark:border-slate-700 shadow-sm flex justify-between items-start">
                                                                <p className="text-sm font-bold text-slate-700 dark:text-slate-200">{sc.title || '(タイトルなし)'}</p>
                                                                <button onClick={() => { if(confirm("このスケジュールを削除しますか？")) setSchedules(schedules.filter(s => s.id !== sc.id)); }} className="opacity-0 group-hover:opacity-100 text-rose-400 hover:text-rose-600 transition-opacity ml-2"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                                {schedules.filter(sc => { if (!sc.date) return false; const start = sc.date; const end = sc.endDate || sc.date; return selectedDayDetails >= start && selectedDayDetails <= end; }).length === 0 && (
                                                    <p className="text-center text-slate-400 text-sm py-4">この日のスケジュールはないよ🌿</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 dark:bg-slate-900 p-4 border-t border-slate-100 dark:border-slate-700 text-center">
                                        <button onClick={() => { setSchedules([...schedules, {id: Date.now().toString() + Math.random(), title: '', date: selectedDayDetails, time: ''}]); setSelectedDayDetails(null); }} className="text-sm font-bold text-primary hover:text-primary-dark transition-colors"><i className="fa-solid fa-plus mr-1"></i>この日に予定を追加</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        <style>{`@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }`}</style>
                    </div>
                );
            };

            const TaskDetail = () => {
                const task = tasks.find(t => t.id === selectedTaskId);
                const [bgmType, setBgmType] = useState('none');
                const [tagInput, setTagInput] = useState('');
                const [taskFileName, setTaskFileName] = useState('');
                
                const [focusTimeLeft, setFocusTimeLeft] = useState(25 * 60);
                const [isTimerRunning, setIsTimerRunning] = useState(false);

                useEffect(() => { return () => stopBGM(); }, []);
                useEffect(() => { if(task) setTaskFileName(`${task.title}.json`); }, [task?.title]);

                useEffect(() => {
                    let interval = null;
                    if (isTimerRunning && focusTimeLeft > 0) { interval = setInterval(() => setFocusTimeLeft(f => f - 1), 1000); } 
                    else if (isTimerRunning && focusTimeLeft === 0) { setIsTimerRunning(false); shootConfetti(); }
                    return () => clearInterval(interval);
                }, [isTimerRunning, focusTimeLeft]);

                if (!task) return null;

                const updateTask = (updates) => setTasks(tasks.map(t => t.id === task.id ? { ...t, ...updates } : t));
                const progress = task.subtasks?.length > 0 ? Math.round((task.subtasks.filter(s => s.status === 'completed').length / task.subtasks.length) * 100) : 0;
                const allTags = Array.from(new Set(tasks.flatMap(t => t.tags || [])));
                const formatTime = (sec) => { const m = Math.floor(sec / 60).toString().padStart(2, '0'); const s = (sec % 60).toString().padStart(2, '0'); return `${m}:${s}`; };

                const handleSubDragStart = (e, id) => { e.dataTransfer.setData('subId', id); e.target.classList.add('dragging-btn'); };
                const handleSubDrop = (e, targetId) => {
                    e.preventDefault(); const sourceId = e.dataTransfer.getData('subId'); if (sourceId === targetId || !sourceId) return;
                    const newSubs = [...(task.subtasks || [])]; const sIdx = newSubs.findIndex(s => s.id === sourceId); const tIdx = newSubs.findIndex(s => s.id === targetId);
                    if(sIdx < 0 || tIdx < 0) return;
                    const [moved] = newSubs.splice(sIdx, 1); newSubs.splice(tIdx, 0, moved); updateTask({ subtasks: newSubs });
                };

                if (isFocusMode) {
                    return (
                        <div className="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-xl flex flex-col items-center justify-center p-4">
                            <button onClick={() => { setIsFocusMode(false); stopBGM(); setIsTimerRunning(false); }} className="absolute top-8 right-8 text-white/50 hover:text-white bg-white/10 hover:bg-white/20 p-4 rounded-full transition-all"><i className="fa-solid fa-xmark text-2xl"></i></button>
                            <h2 className="text-white/60 text-xl mb-4 font-bold tracking-widest"><i className="fa-solid fa-wind mr-2"></i>Deep Focus</h2>
                            <p className="text-4xl md:text-5xl font-extrabold text-white mb-8 text-center drop-shadow-lg">{task.title}</p>
                            
                            <div className="mb-8 text-center bg-white/5 p-6 rounded-[2rem] border border-white/10 backdrop-blur-md shadow-2xl">
                                <div className="text-7xl md:text-8xl font-mono text-white font-black tracking-widest drop-shadow-lg mb-6">{formatTime(focusTimeLeft)}</div>
                                <div className="flex gap-3 justify-center flex-wrap">
                                    <button onClick={() => setIsTimerRunning(!isTimerRunning)} className="px-8 py-3 bg-gradient-to-r from-primary to-primary-dark text-white rounded-full font-bold shadow-lg hover:shadow-xl hover:scale-105 transition-all text-lg min-w-[140px]">
                                        {isTimerRunning ? <><i className="fa-solid fa-pause mr-2"></i>一時停止</> : <><i className="fa-solid fa-play mr-2"></i>スタート</>}
                                    </button>
                                    <button onClick={() => { setIsTimerRunning(false); setFocusTimeLeft(25 * 60); }} className="px-5 py-3 bg-white/10 text-white rounded-full font-bold hover:bg-white/20 transition-all shadow-md"><i className="fa-solid fa-stopwatch mr-1"></i>25分(集中)</button>
                                    <button onClick={() => { setIsTimerRunning(false); setFocusTimeLeft(5 * 60); }} className="px-5 py-3 bg-emerald-500/20 text-emerald-300 border border-emerald-500/50 rounded-full font-bold hover:bg-emerald-500/30 transition-all shadow-md"><i className="fa-solid fa-mug-hot mr-1"></i>5分(休憩)</button>
                                </div>
                            </div>
                            
                            <div className="flex gap-3 mb-10 bg-white/10 p-2 rounded-full backdrop-blur-md border border-white/20 shadow-xl">
                                <button onClick={()=>{setBgmType('none'); stopBGM();}} className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${bgmType==='none'?'bg-white text-slate-900 shadow-md':'text-white/60 hover:text-white'}`}>無音</button>
                                <button onClick={()=>{setBgmType('rain'); playBGM('rain');}} className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${bgmType==='rain'?'bg-emerald-400 text-white shadow-md shadow-emerald-400/30':'text-white/60 hover:text-white'}`}><i className="fa-solid fa-cloud-rain mr-2"></i>森の雨</button>
                                <button onClick={()=>{setBgmType('cafe'); playBGM('cafe');}} className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${bgmType==='cafe'?'bg-amber-400 text-white shadow-md shadow-amber-400/30':'text-white/60 hover:text-white'}`}><i className="fa-solid fa-mug-hot mr-2"></i>カフェ</button>
                            </div>
                            
                            <div className="w-full max-w-md bg-white/5 border border-white/10 rounded-[2rem] p-6 backdrop-blur-lg">
                                <h3 className="text-white/50 text-sm font-bold border-b border-white/10 pb-2 mb-4 flex items-center"><i className="fa-regular fa-compass mr-2"></i>残りのステップ</h3>
                                <div className="space-y-3 max-h-48 overflow-y-auto pr-2">
                                    {task.subtasks.filter(s => s.status !== 'completed').map(sub => (
                                        <div key={sub.id} className="flex items-start gap-3 p-3 bg-black/20 rounded-xl border border-white/5 hover:bg-black/30 transition-colors">
                                            <button onClick={() => { updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, status: 'completed'} : s) }); logActivityAndGainXP(); shootConfetti(); }} className="mt-0.5 text-white/40 hover:text-emerald-400 transition-colors"><i className="fa-regular fa-circle text-2xl"></i></button>
                                            <div className="flex-1">
                                                <span className="text-white/90 leading-snug font-medium block">{sub.title}</span>
                                                {(sub.dueDate || sub.dueTime) && <div className="text-xs text-white/40 mt-1 flex items-center"><i className="fa-regular fa-clock mr-1"></i>{sub.dueDate} {sub.dueTime}</div>}
                                            </div>
                                        </div>
                                    ))}
                                    {task.subtasks.filter(s => s.status !== 'completed').length === 0 && <p className="text-emerald-400 font-bold text-center py-4 text-lg"><i className="fa-solid fa-check-double mr-2"></i>すべて完了！</p>}
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="flex-1 min-w-0 glass-panel rounded-[2rem] p-6 md:p-10">
                        <div className="flex items-center justify-between mb-8 pb-4 border-b border-slate-200/50 dark:border-slate-700/50">
                            <button onClick={() => setCurrentView('dashboard')} className="text-slate-500 hover:text-primary font-bold bg-white/50 dark:bg-slate-800/50 px-4 py-2 rounded-xl transition-all"><i className="fa-solid fa-arrow-left mr-2"></i>戻る</button>
                            <div className="flex gap-3 flex-wrap justify-end">
                                {githubSettings.token && (
                                    <div className="flex items-center gap-1 bg-white/50 dark:bg-slate-900/50 border border-white/50 dark:border-slate-700 rounded-xl p-1 shadow-inner">
                                        <LocalInput value={taskFileName} onChange={setTaskFileName} className="input-glass input-glass-noborder w-24 md:w-36 text-sm p-1.5 font-mono" placeholder="ファイル名"/>
                                        <button onClick={() => uploadTextToGithub(`data/${task.title}/${taskFileName}`, JSON.stringify(task, null, 2))} disabled={isGithubLoading} className="p-2 text-slate-500 hover:text-white hover:bg-primary rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed" title={`data/${task.title}/ フォルダへ保存`}>{isGithubLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-brands fa-github"></i>}</button>
                                    </div>
                                )}
                                <button onClick={() => updateTask({ isSecret: !task.isSecret })} className={`p-3 rounded-xl transition-all shadow-sm ${task.isSecret ? 'text-rose-500 bg-rose-100 border border-rose-200 dark:bg-rose-900/30' : 'text-slate-500 bg-white/50 hover:bg-white border border-white/50 dark:bg-slate-800/50 dark:hover:bg-slate-800'}`} title="秘密にする"><i className={`fa-solid ${task.isSecret ? 'fa-lock' : 'fa-lock-open'}`}></i></button>
                                <button onClick={() => setIsFocusMode(true)} className="px-5 py-2.5 bg-gradient-to-r from-primary to-primary-dark text-white rounded-xl shadow-md hover:shadow-lg hover:scale-105 font-bold text-sm transition-all"><i className="fa-solid fa-expand mr-2"></i>集中モード</button>
                            </div>
                        </div>

                        <LocalInput value={task.title} onChange={(val) => updateTask({ title: val })} className="input-glass input-glass-noborder input-glass-lg w-full text-3xl md:text-4xl font-extrabold px-3 py-2 mb-6" placeholder="壮大な目標を入力..." />

                        <div className="flex flex-col xl:flex-row gap-4 mb-8 bg-white/40 dark:bg-slate-900/40 p-4 rounded-2xl border border-white/60 dark:border-slate-700 shadow-sm">
                            <div className="flex items-center gap-4 flex-wrap flex-1">
                                <div className="flex items-center flex-wrap gap-2">
                                    <div className="flex items-center">
                                        <i className={`fa-regular fa-calendar mr-2 text-lg ${getDueDateStyles(task.dueDate, false).textClass}`}></i>
                                        <span className={`text-sm font-bold mr-2 ${getDueDateStyles(task.dueDate, false).textClass}`}>締め切り:</span>
                                        <SafeDateInput type="date" className={`input-glass px-3 py-1.5 text-sm cursor-pointer ${getDueDateStyles(task.dueDate, false).textClass}`} value={task.dueDate || ''} onChange={(val) => updateTask({ dueDate: val })} title="日付"/>
                                    </div>
                                    <div className="flex items-center">
                                        <SafeDateInput type="time" className={`input-glass px-3 py-1.5 text-sm cursor-pointer ml-1 ${getDueDateStyles(task.dueDate, false).textClass}`} value={task.dueTime || ''} onChange={(val) => updateTask({ dueTime: val })} title="時間"/>
                                    </div>
                                </div>
                                <div className="flex items-center xl:border-l border-slate-300/50 xl:pl-4 dark:border-slate-700">
                                    <i className="fa-solid fa-flag text-slate-400 text-lg mr-2"></i>
                                    <span className="text-sm font-bold text-slate-500 mr-2">優先度:</span>
                                    <div className="flex bg-white/50 dark:bg-slate-800/50 rounded-xl border border-white/80 dark:border-slate-600 p-1 shadow-inner">
                                        <button onClick={() => updateTask({ priority: 3 })} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${task.priority === 3 ? 'bg-rose-500 text-white shadow-md' : 'text-slate-500 hover:bg-rose-100 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-fire mr-1"></i>高</button>
                                        <button onClick={() => updateTask({ priority: 2 })} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${task.priority === 2 ? 'bg-amber-500 text-white shadow-md' : 'text-slate-500 hover:bg-amber-100 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-star mr-1"></i>中</button>
                                        <button onClick={() => updateTask({ priority: 1 })} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${task.priority === 1 ? 'bg-emerald-500 text-white shadow-md' : 'text-slate-500 hover:bg-emerald-100 dark:hover:bg-slate-700'}`}><i className="fa-solid fa-leaf mr-1"></i>低</button>
                                        <button onClick={() => updateTask({ priority: 0 })} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${!task.priority ? 'bg-slate-400 text-white shadow-md' : 'text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}`}>なし</button>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col justify-center xl:border-l border-slate-300/50 xl:pl-4 dark:border-slate-700 w-full xl:w-auto">
                                <div className="flex items-center gap-2 flex-wrap">
                                    <i className="fa-solid fa-tag text-slate-400 text-lg"></i>
                                    {task.tags?.map(tag => (
                                        <span key={tag} className="bg-primary text-white shadow-sm px-3 py-1 rounded-full text-xs font-bold flex items-center">
                                            #{tag} <button onClick={() => updateTask({ tags: task.tags.filter(t => t !== tag) })} className="ml-1.5 opacity-70 hover:opacity-100"><i className="fa-solid fa-xmark"></i></button>
                                        </span>
                                    ))}
                                    <input type="text" value={tagInput} onChange={e => setTagInput(e.target.value)}
                                        onKeyDown={(e) => { if(e.key === 'Enter' && tagInput.trim()) { updateTask({ tags: [...new Set([...(task.tags||[]), tagInput.trim().replace(/^#/,'')])]}); setTagInput(''); } }}
                                        placeholder="タグ追加(Enter)" className="input-glass px-3 py-1.5 w-36 text-xs" />
                                </div>
                                {allTags.length > 0 && (
                                    <div className="mt-2.5 flex flex-wrap gap-1.5 items-center">
                                        <span className="text-[10px] text-slate-400 font-bold mr-1"><i className="fa-solid fa-clock-rotate-left mr-1"></i>履歴から追加:</span>
                                        {allTags.map(tag => (
                                            <button key={tag} onClick={() => {
                                                const hasTag = task.tags?.includes(tag);
                                                updateTask({ tags: hasTag ? task.tags.filter(t => t !== tag) : [...(task.tags||[]), tag]});
                                            }} className={`text-[10px] px-2 py-0.5 rounded-full border transition-all shadow-sm ${task.tags?.includes(tag) ? 'bg-primary text-white border-primary' : 'bg-white/60 text-slate-500 border-white/80 dark:bg-slate-800/60 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                                                {task.tags?.includes(tag) ? <i className="fa-solid fa-check mr-1"></i> : null}#{tag}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="flex items-center gap-5 mb-8">
                            <div className="flex-1 bg-white/50 dark:bg-slate-800/50 p-3 rounded-2xl border border-white/50 dark:border-slate-700 shadow-sm">
                                <div className="flex justify-between text-xs mb-1.5 font-bold text-slate-500 px-1"><span>達成度</span><span className="text-primary">{progress}%</span></div>
                                <div className="w-full bg-slate-200/50 dark:bg-slate-900/50 rounded-full h-2.5 overflow-hidden"><div className="bg-gradient-to-r from-emerald-400 to-teal-400 h-full rounded-full transition-all duration-700 ease-out" style={{ width: `${progress}%` }}></div></div>
                            </div>
                            <button onClick={() => generateAiMilestones(task)} disabled={isAiLoading} className="px-4 py-3 bg-white hover:bg-emerald-50 text-emerald-600 rounded-2xl shadow-sm border border-emerald-100 hover:border-emerald-300 text-xs font-bold transition-all flex flex-col items-center justify-center min-w-[120px]">
                                {isAiLoading ? <i className="fa-solid fa-seedling animate-bounce text-lg mb-1"></i> : <><i className="fa-solid fa-wand-magic-sparkles text-lg mb-1"></i> AI細分化</>}
                            </button>
                        </div>

                        <h3 className="font-bold text-lg mb-4 text-slate-700 dark:text-slate-200 flex items-center"><i className="fa-solid fa-list-check text-primary mr-2"></i>マイルストーン (細分化)</h3>
                        <div className="space-y-4 mb-10">
                            {task.subtasks.map((sub) => (
                                <div key={sub.id} draggable onDragStart={(e) => handleSubDragStart(e, sub.id)} onDragEnd={(e) => e.target.classList.remove('dragging-btn')} onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleSubDrop(e, sub.id)}
                                     className="flex items-start gap-3 p-4 bg-white/60 dark:bg-slate-900/60 rounded-2xl group border border-white/60 dark:border-slate-700 shadow-sm hover:shadow-md transition-all cursor-grab active:cursor-grabbing">
                                    <div className="mt-1.5 text-slate-300 cursor-grab px-1"><i className="fa-solid fa-grip-vertical"></i></div>
                                    <button onClick={() => {
                                        const newStatus = sub.status === 'active' ? 'completed' : 'active';
                                        updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, status: newStatus} : s) });
                                        if(newStatus === 'completed') shootConfetti(); 
                                    }} className="mt-1 text-slate-300 hover:text-emerald-500 transition-colors drop-shadow-sm">
                                        {sub.status === 'completed' ? <i className="fa-solid fa-circle-check text-emerald-500 text-2xl"></i> : <i className="fa-regular fa-circle text-2xl"></i>}
                                    </button>
                                    <div className="flex-1 flex flex-col gap-2">
                                        <LocalInput value={sub.title} onChange={(val) => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, title: val} : s) })} className={`w-full input-glass input-glass-noborder px-2 py-1 text-base ${sub.status === 'completed' ? 'line-through text-slate-400' : 'font-bold'}`} placeholder="具体的なアクション..." />
                                        <LocalInput value={sub.memo||''} onChange={(val) => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, memo: val} : s) })} className="w-full input-glass input-glass-noborder px-2 py-1 text-xs" placeholder="補足メモ..." />
                                        <div className="flex flex-wrap items-center gap-3 mt-1 px-1">
                                            <div className="flex items-center gap-1.5 bg-white/40 dark:bg-slate-800/40 rounded-xl p-1 shadow-inner border border-white/50 dark:border-slate-700">
                                                <i className="fa-regular fa-calendar text-slate-400 text-xs ml-1.5"></i>
                                                <SafeDateInput type="date" className={`input-glass input-glass-noborder px-2 py-1 text-xs cursor-pointer ${sub.status === 'completed' ? 'text-slate-400' : 'text-slate-500 dark:text-slate-300'}`} value={sub.dueDate || ''} onChange={(val) => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, dueDate: val} : s) })} title="期限(日付)" />
                                            </div>
                                            <div className="flex items-center gap-1.5 bg-white/40 dark:bg-slate-800/40 rounded-xl p-1 shadow-inner border border-white/50 dark:border-slate-700">
                                                <i className="fa-regular fa-clock text-slate-400 text-xs ml-1.5"></i>
                                                <SafeDateInput type="time" className={`input-glass input-glass-noborder px-2 py-1 text-xs cursor-pointer ${sub.status === 'completed' ? 'text-slate-400' : 'text-slate-500 dark:text-slate-300'}`} value={sub.dueTime || ''} onChange={(val) => updateTask({ subtasks: task.subtasks.map(s => s.id === sub.id ? {...s, dueTime: val} : s) })} title="期限(時間)" />
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => updateTask({ subtasks: task.subtasks.filter(s => s.id !== sub.id) })} className="opacity-0 group-hover:opacity-100 text-rose-400 w-8 h-8 rounded-full hover:bg-rose-100 dark:hover:bg-rose-900/30 flex items-center justify-center transition-all"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                            ))}
                            <button onClick={() => updateTask({ subtasks: [...task.subtasks, { id: Date.now().toString() + Math.random(), title: '', status: 'active', dueDate: '', dueTime: '' }] })} className="w-full py-3 border-2 border-dashed border-primary/30 rounded-2xl text-primary hover:bg-primary/5 dark:hover:bg-primary/10 text-sm font-bold transition-colors flex items-center justify-center"><i className="fa-solid fa-plus mr-2"></i>ステップを追加</button>
                        </div>

                        <h3 className="font-bold text-lg mb-3 text-slate-700 dark:text-slate-200 flex items-center"><i className="fa-regular fa-file-lines text-amber-500 mr-2"></i>詳細ノート</h3>
                        <LocalInput isTextarea value={task.memo||''} onChange={(val) => updateTask({ memo: val })} className="w-full h-48 p-4 input-glass resize-y" placeholder="このタスクに関する詳しい情報や参考リンク、思いついたアイデアを自由に書き込んでね🌿" />
                    </div>
                );
            };

            const AnalyticsView = () => {
                const totalCompleted = tasks.filter(t => t.status === 'completed').length;
                const completedRoutines = tasks.filter(t => t.type === 'routine' && t.status === 'completed').length;
                return (
                    <div className="flex-1 glass-panel rounded-[2rem] p-6 md:p-10">
                        <h1 className="text-3xl font-extrabold mb-8 text-slate-800 dark:text-slate-100"><i className="fa-solid fa-chart-line text-primary mr-3"></i>成長の記録</h1>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-10">
                            <div className="p-5 rounded-3xl bg-white/60 dark:bg-slate-800/60 border border-white/50 dark:border-slate-700 text-center shadow-sm hover:shadow-md transition-shadow">
                                <p className="text-xs text-slate-500 font-bold mb-2">現在のレベル</p><p className="text-4xl font-black text-primary">{userStats.level}</p>
                            </div>
                            <div className="p-5 rounded-3xl bg-white/60 dark:bg-slate-800/60 border border-white/50 dark:border-slate-700 text-center shadow-sm hover:shadow-md transition-shadow">
                                <p className="text-xs text-slate-500 font-bold mb-2">総経験値 (XP)</p><p className="text-4xl font-black text-yellow-500">{userStats.xp + ((userStats.level-1)*50)}</p>
                            </div>
                            <div className="p-5 rounded-3xl bg-white/60 dark:bg-slate-800/60 border border-white/50 dark:border-slate-700 text-center shadow-sm hover:shadow-md transition-shadow">
                                <p className="text-xs text-slate-500 font-bold mb-2">完了タスク総数</p><p className="text-4xl font-black text-emerald-500">{totalCompleted}</p>
                            </div>
                            <div className="p-5 rounded-3xl bg-white/60 dark:bg-slate-800/60 border border-white/50 dark:border-slate-700 text-center shadow-sm hover:shadow-md transition-shadow">
                                <p className="text-xs text-slate-500 font-bold mb-2">本日の日課達成</p><p className="text-4xl font-black text-rose-500">{completedRoutines}</p>
                            </div>
                        </div>

                        <h3 className="font-bold text-lg text-slate-700 dark:text-slate-200 mb-4 flex items-center"><i className="fa-solid fa-seedling text-emerald-500 mr-2"></i>アクティビティ・ガーデン</h3>
                        <div className="flex flex-wrap gap-1.5 p-5 border border-white/50 rounded-3xl bg-white/40 dark:bg-slate-900/40 dark:border-slate-700 shadow-inner">
                            {[...Array(60)].map((_, i) => {
                                const d = new Date(); d.setDate(d.getDate() - (59 - i));
                                const dateStr = d.toISOString().split('T')[0];
                                const count = activityLog[dateStr] || 0;
                                let color = 'bg-white/50 dark:bg-slate-800/50';
                                if (count > 0) color = 'bg-emerald-300 dark:bg-emerald-700';
                                if (count > 2) color = 'bg-emerald-400 dark:bg-emerald-600';
                                if (count > 5) color = 'bg-emerald-500 dark:bg-emerald-500';
                                return <div key={i} title={`${dateStr}: ${count}件`} className={`w-3.5 h-3.5 md:w-5 md:h-5 rounded-md ${color} transition-colors hover:scale-125 cursor-pointer`}></div>
                            })}
                        </div>
                    </div>
                );
            };

            const GithubView = () => {
                if(!githubSettings.token) return (
                    <div className="flex-1 p-10 text-center glass-panel rounded-[2rem]">
                        <i className="fa-brands fa-github text-7xl text-slate-300 mb-6 drop-shadow-md"></i>
                        <p className="font-bold mb-6 text-lg">クラウドとつながる魔法の鍵（GitHub設定）がありません☁️</p>
                        <button onClick={() => setCurrentView('settings')} className="bg-gradient-to-r from-primary to-primary-dark text-white px-6 py-3 rounded-xl font-bold shadow-md hover:shadow-lg transition-all">設定画面へ行く</button>
                    </div>
                );

                const handleDropUpload = (e) => { e.preventDefault(); e.currentTarget.classList.remove('dragging'); if(e.dataTransfer.files && e.dataTransfer.files.length > 0) { Array.from(e.dataTransfer.files).forEach(file => uploadToGithub(file)); } };

                return (
                    <div className="flex-1 flex flex-col min-w-0 glass-panel rounded-[2rem] p-6 md:p-10">
                        <div className="flex items-center justify-between mb-8">
                            <h1 className="text-3xl font-extrabold text-slate-800 dark:text-slate-100"><i className="fa-solid fa-cloud text-primary mr-3"></i>クラウドストレージ</h1>
                            <div className="flex gap-3">
                                <button onClick={createGithubFolder} className="px-4 py-2 bg-white/60 dark:bg-slate-700/60 rounded-xl text-sm font-bold hover:bg-white dark:hover:bg-slate-600 shadow-sm transition-all"><i className="fa-solid fa-folder-plus mr-2"></i>新規フォルダ</button>
                                <button onClick={() => fetchGithubPath(githubPath)} className="w-10 h-10 flex items-center justify-center bg-white/60 dark:bg-slate-700/60 rounded-xl font-bold hover:bg-white dark:hover:bg-slate-600 shadow-sm transition-all"><i className="fa-solid fa-rotate-right"></i></button>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 mb-6 p-3 bg-white/50 dark:bg-slate-900/50 rounded-xl border border-white/60 dark:border-slate-700 text-sm font-mono overflow-x-auto shadow-inner">
                            <button onClick={() => fetchGithubPath('')} className="text-primary hover:text-primary-dark font-bold px-2 py-1 bg-white/50 rounded hover:shadow-sm"><i className="fa-solid fa-house"></i></button>
                            {githubPath.split('/').filter(Boolean).map((p, i, arr) => (
                                <React.Fragment key={p}>
                                    <span className="text-slate-400 font-bold">/</span>
                                    <button onClick={() => fetchGithubPath(arr.slice(0, i+1).join('/'))} className="text-primary hover:text-primary-dark font-bold px-2 py-1 bg-white/50 rounded hover:shadow-sm transition-all">{p}</button>
                                </React.Fragment>
                            ))}
                        </div>

                        <div className="flex-1 border-2 border-dashed border-primary/30 rounded-3xl p-6 overflow-y-auto transition-all bg-white/30 dark:bg-slate-900/30 hover:bg-white/50 dark:hover:bg-slate-900/50" onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('dragging'); }} onDragLeave={(e) => e.currentTarget.classList.remove('dragging')} onDrop={handleDropUpload}>
                            {isGithubLoading ? <div className="h-full flex flex-col items-center justify-center text-primary/70"><i className="fa-solid fa-fan fa-spin text-4xl mb-4"></i><p className="font-bold tracking-widest">風の力で通信中...</p></div> : (
                                <div className="space-y-2">
                                    {githubFiles.length === 0 && <div className="h-full flex flex-col items-center justify-center text-slate-400 py-16"><i className="fa-regular fa-file text-5xl mb-4 opacity-50"></i><p className="text-sm font-bold">ファイルはありません<br/>ここにドラッグ＆ドロップで保存できるよ🌿</p></div>}
                                    {githubFiles.map(file => (
                                        <div key={file.sha} className="flex justify-between items-center p-3 hover:bg-white/80 dark:hover:bg-slate-800/80 rounded-2xl border border-transparent hover:border-white/50 dark:hover:border-slate-700 group transition-all shadow-sm">
                                            <div className="flex items-center gap-4 overflow-hidden cursor-pointer flex-1 pl-2" onClick={() => file.type === 'dir' ? fetchGithubPath(file.path) : downloadGithubFile(file)}>
                                                {file.type === 'dir' ? <i className="fa-solid fa-folder text-amber-400 text-2xl drop-shadow-sm"></i> : <i className="fa-regular fa-file-lines text-slate-400 text-2xl drop-shadow-sm"></i>}
                                                <span className="text-base font-bold text-slate-700 dark:text-slate-200 truncate">{file.name}</span>
                                            </div>
                                            <div className="flex items-center opacity-0 group-hover:opacity-100 transition-opacity pr-2">
                                                {file.type === 'file' && <button onClick={() => downloadGithubFile(file)} className="text-slate-400 hover:text-primary w-10 h-10 flex items-center justify-center rounded-full hover:bg-blue-50 transition-colors" title="ダウンロード"><i className="fa-solid fa-download"></i></button>}
                                                <button onClick={() => deleteGithubFile(file)} className="text-slate-400 hover:text-rose-500 w-10 h-10 flex items-center justify-center rounded-full hover:bg-rose-50 transition-colors" title="削除"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const TrashView = () => (
                <div className="flex-1 glass-panel rounded-[2rem] p-6 md:p-10">
                    <h1 className="text-3xl font-extrabold mb-8 text-slate-800 dark:text-slate-100"><i className="fa-solid fa-trash-can text-rose-500 mr-3"></i>ごみ箱</h1>
                    {tasks.filter(t => t.status === 'trash').length === 0 ? <p className="text-center text-slate-400 py-20 font-bold">ごみ箱は空っぽだよ✨</p> : (
                        <div className="space-y-3">
                            {tasks.filter(t => t.status === 'trash').map(task => (
                                <div key={task.id} className="flex justify-between items-center p-4 bg-white/50 dark:bg-slate-900/50 rounded-2xl border border-white/60 dark:border-slate-700 shadow-sm">
                                    <span className="text-slate-500 line-through truncate font-medium pl-2">{task.title}</span>
                                    <div className="flex gap-2 ml-4 flex-shrink-0">
                                        <button onClick={() => setTasks(tasks.map(t => t.id === task.id ? {...t, status: 'active'} : t))} className="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-xl text-xs font-bold hover:bg-emerald-200 transition-colors"><i className="fa-solid fa-rotate-left mr-1"></i>自然に還す(復元)</button>
                                        <button onClick={() => setTasks(tasks.filter(t => t.id !== task.id))} className="px-4 py-2 bg-rose-100 text-rose-700 rounded-xl text-xs font-bold hover:bg-rose-200 transition-colors">完全に消去</button>
                                    </div>
                                </div>
                            ))}
                            <div className="mt-8 flex justify-end">
                                <button onClick={() => setTasks(tasks.filter(t => t.status !== 'trash'))} className="px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold text-sm shadow-md transition-all">ごみ箱を空にする</button>
                            </div>
                        </div>
                    )}
                </div>
            );

            const SettingsView = () => {
                const qrRef = useRef(null);
                
                useEffect(() => {
                    let timer;
                    if (qrRef.current && typeof QRCode !== 'undefined') {
                        qrRef.current.innerHTML = '';
                        timer = setTimeout(() => {
                            try {
                                const settingsData = { github: githubSettings, keys: apiKeys };
                                const jsonStr = JSON.stringify(settingsData); const encodedStr = btoa(unescape(encodeURIComponent(jsonStr)));
                                const baseUrl = window.location.href.split('?')[0]; const finalUrl = `${baseUrl}?sync=${encodedStr}`;
                                new QRCode(qrRef.current, { text: finalUrl, width: 140, height: 140, colorDark : "#1e293b", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.L });
                            } catch (e) {
                                console.error("QR Code generation failed:", e);
                                if(qrRef.current) qrRef.current.innerHTML = '<span class="text-xs text-rose-500">QRの生成に失敗しました😢</span>';
                            }
                        }, 100);
                    }
                    return () => clearTimeout(timer);
                }, [currentView, githubSettings, apiKeys]);

                return (
                    <div className="flex-1 glass-panel rounded-[2rem] p-6 md:p-10 space-y-8">
                        <h1 className="text-3xl font-extrabold mb-6 text-slate-800 dark:text-slate-100"><i className="fa-solid fa-gear text-slate-500 mr-3"></i>設定・カスタマイズ</h1>
                        
                        <div className="p-6 rounded-3xl bg-amber-50/80 dark:bg-amber-900/20 border border-amber-200/50 dark:border-amber-800/50 shadow-sm">
                            <h3 className="font-bold mb-2 flex items-center text-amber-700 dark:text-amber-500 text-lg"><i className="fa-solid fa-file-arrow-up mr-2"></i>データの復元 (お引越し)</h3>
                            <p className="text-sm text-amber-600/80 dark:text-amber-400/80 mb-4 font-medium">以前のバックアップファイル (JSON) を読み込んで、世界を復元します🌿</p>
                            <input type="file" accept=".json" onChange={loadJSONData} className="text-sm file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200 cursor-pointer transition-colors"/>
                        </div>

                        <div className="p-6 rounded-3xl bg-emerald-50/80 dark:bg-emerald-900/20 border border-emerald-200/50 dark:border-emerald-800/50 shadow-sm">
                            <h3 className="font-bold mb-2 flex items-center text-emerald-700 dark:text-emerald-500 text-lg"><i className="fa-solid fa-wand-magic-sparkles mr-2"></i>AI連携 (Gemini)</h3>
                            <p className="text-sm text-emerald-600/80 dark:text-emerald-400/80 mb-4 font-medium">APIキーを設定すると、タスクの「AI細分化」などが使えるようになるよ！✨</p>
                            <div className="flex gap-3">
                                <LocalInput type="password" value={apiKeys.gemini} onChange={val => setApiKeys({...apiKeys, gemini: val})} placeholder="Gemini APIキーを入力..." className="input-glass p-3 w-full max-w-md"/>
                            </div>
                        </div>

                        <div className="p-6 rounded-3xl bg-white/50 dark:bg-slate-800/50 border border-white/60 dark:border-slate-700 shadow-sm">
                            <h3 className="font-bold mb-4 flex items-center text-lg"><i className="fa-solid fa-palette text-primary mr-2"></i>自然を感じるテーマカラー</h3>
                            <div className="flex flex-wrap gap-4">
                                {[{c:'ocean', hex:'#0ea5e9', name:'海 (Ocean)'}, {c:'forest', hex:'#10b981', name:'森 (Forest)'}, {c:'sky', hex:'#6366f1', name:'空 (Sky)'}, {c:'sunset', hex:'#f97316', name:'夕陽 (Sunset)'}, {c:'earth', hex:'#84cc16', name:'大地 (Earth)'}].map(color => (
                                    <button key={color.c} onClick={() => { setThemeColor(`theme-${color.c}`); document.documentElement.className = `${isDarkMode?'dark':'light'} theme-${color.c}`; }} 
                                        className={`w-12 h-12 rounded-full border-4 transition-all shadow-md flex items-center justify-center ${themeColor === `theme-${color.c}` ? 'scale-110 border-white dark:border-slate-300 ring-2 ring-slate-400' : 'border-transparent hover:scale-105'}`} style={{backgroundColor: color.hex}} title={color.name}>
                                        {themeColor === `theme-${color.c}` && <i className="fa-solid fa-check text-white text-sm"></i>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="p-6 rounded-3xl bg-white/50 dark:bg-slate-800/50 border border-white/60 dark:border-slate-700 shadow-sm">
                            <h3 className="font-bold mb-3 flex items-center text-lg"><i className="fa-solid fa-lock text-rose-500 mr-2"></i>シークレットPIN (タスクロック)</h3>
                            <p className="text-xs text-slate-500 mb-3 font-medium">秘密のタスクを見るための鍵を設定してね🔑</p>
                            <div className="flex gap-3">
                                <LocalInput type="password" value={pinCode} onChange={val => {setPinCode(val); localStorage.setItem('taskMaster_pin', val);}} placeholder="数字や文字..." className="input-glass p-3 w-full max-w-xs"/>
                                {pinCode && <button onClick={() => setIsUnlocked(!isUnlocked)} className="px-5 py-3 bg-gradient-to-r from-primary to-primary-dark text-white rounded-xl text-sm font-bold shadow-md hover:shadow-lg transition-all">{isUnlocked ? "ロックする" : "ロック解除中"}</button>}
                            </div>
                        </div>

                        <div className="p-6 rounded-3xl bg-white/50 dark:bg-slate-800/50 border border-white/60 dark:border-slate-700 shadow-sm">
                            <h3 className="font-bold mb-3 flex items-center text-lg"><i className="fa-brands fa-github mr-2"></i>クラウド設定 (GitHub)</h3>
                            <p className="text-xs text-slate-500 mb-4 font-medium">これを入れるとダッシュボードから直接クラウドに保存できるようになるよ☁️</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <LocalInput type="password" placeholder="Personal Access Token" className="input-glass p-3 text-sm" value={githubSettings.token} onChange={val => setGithubSettings({...githubSettings, token: val})}/>
                                <div className="flex gap-3">
                                    <LocalInput placeholder="Owner" className="w-1/2 input-glass p-3 text-sm" value={githubSettings.owner} onChange={val => setGithubSettings({...githubSettings, owner: val})}/>
                                    <LocalInput placeholder="Repo" className="w-1/2 input-glass p-3 text-sm" value={githubSettings.repo} onChange={val => setGithubSettings({...githubSettings, repo: val})}/>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                            <button onClick={() => { const nd = !isDarkMode; setIsDarkMode(nd); document.documentElement.classList.toggle('dark', nd); }} className="p-6 rounded-3xl bg-white/60 dark:bg-slate-800/60 border border-white/60 dark:border-slate-700 text-center hover:bg-white dark:hover:bg-slate-700 shadow-sm hover:shadow-md transition-all group">
                                <i className={`fa-solid ${isDarkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-500'} text-3xl mb-3 group-hover:rotate-12 transition-transform`}></i><br/><span className="text-sm font-bold">昼夜切替</span>
                            </button>
                            <button onClick={() => exportAllData(backupHistory[0] || 'backup.json', { tasks, schedules, activityLog, userStats, memos, todos, githubSettings, apiKeys, calendarButtons, calendarStamps })} className="p-6 rounded-3xl bg-white/60 dark:bg-slate-800/60 border border-white/60 dark:border-slate-700 text-center hover:bg-white dark:hover:bg-slate-700 shadow-sm hover:shadow-md transition-all group">
                                <i className="fa-solid fa-download text-emerald-500 text-3xl mb-3 group-hover:-translate-y-1 transition-transform"></i><br/><span className="text-sm font-bold">端末へ保存</span>
                            </button>
                            
                            <div className="col-span-2 p-6 rounded-3xl bg-white/60 dark:bg-slate-800/60 border border-white/60 dark:border-slate-700 flex flex-col items-center justify-center shadow-sm text-center">
                                <p className="text-sm font-bold mb-1 text-slate-600 dark:text-slate-300">📱 スマホ設定引継ぎQRコード</p>
                                <p className="text-[10px] text-slate-500 mb-3">※GitHubとAPIキーの「設定のみ」を引き継ぎます</p>
                                <div ref={qrRef} className="p-3 bg-white rounded-2xl shadow-inner min-h-[160px] flex items-center justify-center"></div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row gap-6 p-3 md:p-6 lg:p-8 max-w-[1400px] mx-auto">
                    <Sidebar />
                    <div className="flex-1 min-w-0">
                        {currentView === 'dashboard' && <Dashboard />}
                        {currentView === 'taskDetail' && <TaskDetail />}
                        {currentView === 'trash' && <TrashView />}
                        {currentView === 'settings' && <SettingsView />}
                        {currentView === 'analytics' && <AnalyticsView />}
                        {currentView === 'github' && <GithubView />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
